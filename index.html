<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROVEXIS - Orbital Terminal Blueprints</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-yellow: #ffe600;
      --neon-green: #00ff66;
      --bg-dark: #0a0a0f;
      --hud-bg: rgba(10, 10, 15, 0.95);
      --hud-border: 1px solid var(--neon-cyan);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
      overflow: hidden;
    }

    #header {
      position: absolute; top: 20px; left: 30px; z-index: 10;
      pointer-events: none;
    }
    #header h1 {
      margin: 0; font-size: 2.2rem; letter-spacing: 4px;
      text-shadow: 0 0 10px var(--neon-cyan);
    }
    #header p {
      margin: 5px 0 0 0; font-size: 0.85rem; color: #888;
      letter-spacing: 2px;
    }

    /* CHÚ THÍCH MÀU SẮC TRÊN BẢN ĐỒ */
    #legend {
      position: absolute; bottom: 25px; left: 30px; z-index: 10;
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 10px 15px; font-size: 0.8rem;
    }
    .legend-item { display: flex; align-items: center; margin: 4px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }

    #layout-container {
      display: flex; width: 100%; height: 100%;
    }
    #globe-container {
      width: 100%; height: 100%;
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    /* PANEL BÊN PHẢI */
    #side-panel {
      width: 0%; height: 100%;
      background: var(--hud-bg);
      border-left: var(--hud-border);
      box-shadow: -5px 0 20px rgba(0, 243, 255, 0.2);
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex; flex-direction: column;
      overflow-y: auto; z-index: 5;
    }
    .panel-content {
      padding: 30px; width: 100vw; max-width: 50vw; opacity: 0;
      transition: opacity 0.4s; box-sizing: border-box;
    }

    body.panel-open #globe-container { width: 50%; }
    body.panel-open #side-panel { width: 50%; }
    body.panel-open .panel-content { opacity: 1; transition-delay: 0.3s; }

    /* 2D CANVAS BLUEPRINT CONTAINER */
    #blueprint-container {
      width: 100%; height: 360px;
      border: 1px dashed var(--neon-cyan);
      margin-top: 15px; position: relative;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.05) 0%, rgba(10, 10, 15, 0.95) 100%);
      display: flex; align-items: center; justify-content: center;
    }
    #blueprint-canvas {
      width: 100%; height: 100%;
      display: block;
    }

    .hud-title {
      font-size: 1.4rem; border-bottom: 1px solid var(--neon-cyan);
      padding-bottom: 8px; margin-bottom: 16px;
    }
    .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: transparent; color: var(--neon-pink);
      border: 1px solid var(--neon-pink);
      padding: 6px 14px; cursor: pointer; font-family: inherit;
    }
    .close-btn:hover { background: var(--neon-pink); color: #fff; }
    .status-text { color: var(--neon-green); font-size: 0.85rem; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="header">
    <h1>AEROVEXIS</h1>
    <p>Global Aeronautical Intelligence & Orbital Terminal Blueprints</p>
  </div>

  <div id="legend">
    <div class="legend-item"><span class="dot" style="background: var(--neon-pink);"></span> MAJOR AIRPORT (LARGE)</div>
    <div class="legend-item"><span class="dot" style="background: var(--neon-yellow);"></span> REGIONAL AIRPORT (MEDIUM)</div>
    <div class="legend-item"><span class="dot" style="background: var(--neon-cyan);"></span> CONNECTED DESTINATIONS</div>
  </div>

  <div id="layout-container">
    <div id="globe-container"></div>
    
    <div id="side-panel">
      <div class="panel-content">
        <button class="close-btn" onclick="closePanel()">[ ESC / CLOSE ]</button>
        <div class="hud-title" id="airport-name">TERMINAL LOCKED</div>
        <p><strong>CODE:</strong> <span id="airport-code">---</span></p>
        <p><strong>ELEVATION:</strong> <span id="airport-elev">---</span> ft</p>
        <p><strong>COUNTRY:</strong> <span id="airport-country" style="color: #fff">---</span></p>
        <p><strong>MUNICIPALITY:</strong> <span id="airport-municipality">---</span></p>
        <p><strong>DIRECT ROUTES:</strong> <span id="airport-routes" style="color: var(--neon-cyan)">---</span></p>
        
        <!-- Khung chứa Blueprint 2D -->
        <div id="blueprint-container">
          <canvas id="blueprint-canvas"></canvas>
        </div>
        <div class="status-text">> RUNWAY VECTOR BLUEPRINT LOADED [TRUE SCALE]</div>
      </div>
    </div>
  </div>

  <script>
    const globeContainer = document.getElementById('globe-container');
    
    let airportsMap = new Map();
    let airportsList = [];
    let countriesMap = new Map();
    let runwaysList = [];
    let routesList = [];
    let selectedAirportId = null;
    let connectedAirportIds = new Set();

    // 1. KHỞI TẠO ĐỊA CẦU
    const world = Globe()(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .backgroundColor('#0a0a0f')
      .showAtmosphere(true)
      .atmosphereColor('#00f3ff')
      .atmosphereAltitude(0.12)
      
      .pointLat('latitude_deg')
      .pointLng('longitude_deg')
      .pointAltitude(0)
      
      // PHÂN CẤP KÍCH THƯỚC ĐIỂM
      .pointRadius(d => {
        if (!selectedAirportId) return d.type === 'large_airport' ? 0.38 : 0.16;
        if (d.ident === selectedAirportId) return 0.6;
        if (connectedAirportIds.has(d.iata_code) || connectedAirportIds.has(d.ident)) return 0.35;
        return 0.08;
      })
      
      // PHÂN CẤP MÀU SẮC ĐIỂM (HỒNG NEON VS VÀNG NEON)
      .pointColor(d => {
        if (!selectedAirportId) {
          return d.type === 'large_airport' ? '#ff007f' : '#ffe600';
        }
        if (d.ident === selectedAirportId) return '#ffffff'; // Sân bay được chọn chuyển sang màu trắng sáng
        if (connectedAirportIds.has(d.iata_code) || connectedAirportIds.has(d.ident)) return '#00f3ff'; // Tuyến kết nối: Cyan
        return 'rgba(40, 40, 60, 0.3)'; // Điểm không liên quan: Làm tối mờ
      })
      .pointResolution(6)
      
      // 1. ĐƯỜNG BAY CỰC MỎNG (~1-2PX) VÀ ĐỨNG YÊN
      .arcColor(() => ['rgba(0, 243, 255, 0.8)', 'rgba(255, 0, 127, 0.8)'])
      .arcAltitude(0.15)
      .arcStroke(0.2) // Siêu mỏng chuẩn 1-2 pixel
      .onPointClick(point => {
        if (point) handleAirportSelect(point);
      });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.1;
    world.controls().enableDamping = true;

    // 2. TẢI DỮ LIỆU
    Promise.all([
      fetchCSV('countries.csv'),
      fetchCSV('airports.csv'),
      fetchCSV('runways.csv'),
      fetchRoutes('routes.dat')
    ]).then(([countries, airports, runways, routes]) => {
      countries.forEach(c => countriesMap.set(c.code, c.name));

      airportsList = airports.filter(d => 
        d.latitude_deg && d.longitude_deg &&
        (d.type === 'large_airport' || d.type === 'medium_airport')
      );
      
      airportsList.forEach(a => {
        if (a.ident) airportsMap.set(a.ident, a);
        if (a.iata_code) airportsMap.set(a.iata_code, a);
      });

      runwaysList = runways;
      routesList = routes;

      world.pointsData(airportsList);
    });

    function fetchCSV(filename) {
      return new Promise(resolve => {
        Papa.parse(filename, {
          download: true, header: true, dynamicTyping: true,
          complete: res => resolve(res.data)
        });
      });
    }

    function fetchRoutes(filename) {
      return new Promise(resolve => {
        Papa.parse(filename, {
          download: true, header: false, dynamicTyping: true,
          complete: res => {
            const cleanRoutes = res.data.map(r => ({ src: r[2], dst: r[4] })).filter(r => r.src && r.dst);
            resolve(cleanRoutes);
          }
        });
      });
    }

    // 3. XỬ LÝ CLICK SÂN BAY
    function handleAirportSelect(point) {
      selectedAirportId = point.ident;
      connectedAirportIds.clear();

      const matchedRoutes = [];
      const codeIATA = point.iata_code;
      const codeICAO = point.ident;

      routesList.forEach(r => {
        if (r.src === codeIATA || r.src === codeICAO) {
          const target = airportsMap.get(r.dst);
          if (target) {
            connectedAirportIds.add(r.dst);
            matchedRoutes.push({
              startLat: point.latitude_deg, startLng: point.longitude_deg,
              endLat: target.latitude_deg, endLng: target.longitude_deg
            });
          }
        } else if (r.dst === codeIATA || r.dst === codeICAO) {
          const origin = airportsMap.get(r.src);
          if (origin) {
            connectedAirportIds.add(r.src);
            matchedRoutes.push({
              startLat: origin.latitude_deg, startLng: origin.longitude_deg,
              endLat: point.latitude_deg, endLng: point.longitude_deg
            });
          }
        }
      });

      world.arcsData(matchedRoutes);
      world.pointsData([...airportsList]);

      openPanel(point, matchedRoutes.length);
    }

    // 4. MỞ PANEL & DỰNG BLUEPRINT 2D
    function openPanel(point, routeCount) {
      world.controls().autoRotate = false;
      world.pointOfView({ lat: point.latitude_deg, lng: point.longitude_deg, altitude: 1.2 }, 800);

      document.body.classList.add('panel-open');

      const fullCountryName = countriesMap.get(point.iso_country) || point.iso_country || 'N/A';

      document.getElementById('airport-name').innerText = `> ${point.name || 'UNKNOWN'}`;
      document.getElementById('airport-code').innerText = `${point.ident || '---'} / ${point.iata_code || '---'}`;
      document.getElementById('airport-elev').innerText = point.elevation_ft || 'N/A';
      document.getElementById('airport-country').innerText = fullCountryName;
      document.getElementById('airport-municipality').innerText = point.municipality || 'N/A';
      document.getElementById('airport-routes').innerText = `${routeCount} Connections`;

      setTimeout(() => {
        world.width(window.innerWidth / 2);
        drawRunwayBlueprint2D(point.ident);
      }, 400);
    }

    function closePanel() {
      document.body.classList.remove('panel-open');
      world.controls().autoRotate = true;
      selectedAirportId = null;
      connectedAirportIds.clear();
      
      world.arcsData([]);
      world.pointsData([...airportsList]);

      setTimeout(() => {
        world.width(window.innerWidth);
      }, 100);
    }

    window.addEventListener('resize', () => {
      world.width(document.body.classList.contains('panel-open') ? window.innerWidth / 2 : window.innerWidth);
      world.height(window.innerHeight);
    });

    // 5. VẼ BLUEPRINT ĐỊA HÌNH ĐƯỜNG BĂNG 2D BẰNG HTML5 CANVAS
    function drawRunwayBlueprint2D(airportIdent) {
      const canvas = document.getElementById('blueprint-canvas');
      const container = document.getElementById('blueprint-container');
      
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Xóa khung vẽ
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Vẽ vòng la bàn định hướng (Compass Rose Radar)
      ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
      ctx.lineWidth = 1;
      
      [60, 110, 150].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      });

      // Trục chữ thập Bắc - Nam - Đông - Tây
      ctx.beginPath();
      ctx.moveTo(cx, cy - 160); ctx.lineTo(cx, cy + 160);
      ctx.moveTo(cx - 160, cy); ctx.lineTo(cx + 160, cy);
      ctx.stroke();

      ctx.fillStyle = '#00f3ff';
      ctx.font = '10px "Share Tech Mono"';
      ctx.fillText('N (000°)', cx - 18, cy - 165);
      ctx.fillText('S (180°)', cx - 18, cy + 175);
      ctx.fillText('E', cx + 165, cy + 4);
      ctx.fillText('W', cx - 178, cy + 4);

      // Lọc đường băng thuộc sân bay từ runways.csv
      const rws = runwaysList.filter(r => r.airport_ident === airportIdent);

      if (rws.length === 0) {
        ctx.fillStyle = '#888';
        ctx.font = '12px "Share Tech Mono"';
        ctx.textAlign = 'center';
        ctx.fillText('> NO GEOMETRIC RUNWAY DATA FOUND', cx, cy);
        return;
      }

      // Vẽ từng dải đường băng chuẩn góc xoay thực tế
      rws.forEach((r, idx) => {
        const lengthPx = Math.min(Math.max((r.length_ft || 6000) / 45, 120), 260); // Chuẩn hóa tỉ lệ
        const widthPx = Math.max((r.width_ft || 150) / 12, 10);
        const headingDeg = r.heading_degT !== null && r.heading_degT !== undefined ? r.heading_degT : 0;
        const rad = (headingDeg * Math.PI) / 180;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rad); // Xoay theo góc la bàn thực tế

        // Thân đường băng
        ctx.fillStyle = 'rgba(0, 243, 255, 0.2)';
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 1.5;
        ctx.fillRect(-widthPx / 2, -lengthPx / 2, widthPx, lengthPx);
        ctx.strokeRect(-widthPx / 2, -lengthPx / 2, widthPx, lengthPx);

        // Vạch kẻ tim đường băng (Centerline)
        ctx.strokeStyle = '#ffe600';
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(0, -lengthPx / 2 + 10);
        ctx.lineTo(0, lengthPx / 2 - 10);
        ctx.stroke();
        ctx.setLineDash([]);

        // Số hiệu đầu đường băng (Ví dụ: 07L / 25R)
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px "Share Tech Mono"';
        ctx.textAlign = 'center';
        if (r.le_ident) ctx.fillText(r.le_ident, 0, lengthPx / 2 - 8);
        if (r.he_ident) ctx.fillText(r.he_ident, 0, -lengthPx / 2 + 14);

        ctx.restore();
      });
    }
  </script>
</body>
</html>
