<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROVEXIS - Orbital Command Center</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ea;
      --neon-green: #00ff66;
      --neon-alert: #ff3333;
      --bg-dark: #07070a;
      --hud-bg: rgba(7, 7, 10, 0.85);
      --hud-border: 1px solid rgba(0, 243, 255, 0.4);
    }

    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background-color: var(--bg-dark); font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan); overflow: hidden;
    }

    /* BỐ CỤC CHÍNH */
    #layout-container { display: flex; width: 100%; height: 100%; position: relative; }
    
    /* LEFT PANEL - CÁC CHỨC NĂNG (Luôn hiện) */
    #left-panel {
      width: 300px; height: 100%; background: var(--hud-bg); border-right: var(--hud-border);
      position: absolute; left: 0; top: 0; z-index: 10;
      box-shadow: 5px 0 20px rgba(0, 243, 255, 0.1); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
    }

    /* MAIN GLOBE AREA */
    #globe-wrapper {
      width: calc(100vw - 300px); height: 100%; margin-left: 300px;
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* RIGHT PANEL - BLUEPRINT (Ẩn mặc định) */
    #right-panel {
      width: 0%; height: 100%; background: var(--hud-bg); border-left: var(--hud-border);
      box-shadow: -5px 0 20px rgba(0, 243, 255, 0.1);
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      position: absolute; right: 0; top: 0; z-index: 10; overflow: hidden;
    }

    /* KHI MỞ RIGHT PANEL (Click Airport) */
    body.panel-open #globe-wrapper { width: calc(100vw - 300px - 45vw); }
    body.panel-open #right-panel { width: 45vw; }
    
    /* TIÊU ĐỀ & NÚT CHỨC NĂNG */
    h1 { font-size: 2rem; margin-top: 0; text-shadow: 0 0 10px var(--neon-cyan); letter-spacing: 2px; }
    .subtitle { font-size: 0.8rem; color: #aaa; margin-bottom: 30px; }
    
    .hud-btn {
      background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan);
      padding: 10px; margin-bottom: 10px; cursor: pointer; font-family: inherit;
      text-align: left; transition: all 0.3s;
    }
    .hud-btn:hover, .hud-btn.active {
      background: rgba(0, 243, 255, 0.2); box-shadow: inset 0 0 10px var(--neon-cyan);
    }

    /* HUD DƯỚI TRÁI - HIỂN THỊ DANH SÁCH SÂN BAY KHI HOVER QUỐC GIA */
    #country-hud {
      margin-top: auto; border-top: 1px dashed var(--neon-cyan); padding-top: 15px;
      min-height: 200px;
    }
    .country-title { color: var(--neon-magenta); font-size: 1.2rem; margin-bottom: 5px; }

    /* NỘI DUNG RIGHT PANEL */
    .panel-content { padding: 30px; opacity: 0; transition: opacity 0.5s; width: 40vw; }
    body.panel-open .panel-content { opacity: 1; transition-delay: 0.4s; }
    .close-btn { color: var(--neon-alert); border-color: var(--neon-alert); float: right; padding: 5px 10px; background: transparent; cursor: pointer; }
    
    #blueprint-canvas { width: 100%; height: 350px; border: 1px solid var(--neon-green); margin-top: 20px; }
    
    /* TOOLTIP */
    .globe-tooltip {
      background: rgba(0,0,0,0.8); border: 1px solid var(--neon-cyan); padding: 10px; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="layout-container">
    
    <!-- PANEL TRÁI: ĐIỀU KHIỂN & CHỨC NĂNG -->
    <div id="left-panel">
      <h1>AEROVEXIS</h1>
      <div class="subtitle">ORBITAL COMMAND HUD</div>

      <div style="margin-bottom: 10px; color: #fff;">[ NETWORK LAYERS ]</div>
      <button class="hud-btn" id="btn-navaids">[+] Navaids & Beacons (VOR/NDB)</button>
      <button class="hud-btn" id="btn-routes">[+] Airway Corridors</button>
      <button class="hud-btn" id="btn-heatmap">[*] Density Heatmap</button>

      <!-- KHU VỰC HIỂN THỊ KHI HOVER QUỐC GIA -->
      <div id="country-hud">
        <div style="color: #666;">> AWAITING TERRITORY SCAN...</div>
        <div class="country-title" id="hud-country-name"></div>
        <div style="font-size: 0.9rem;" id="hud-stats">Hover on map to scan borders.</div>
        <ul id="hud-airport-list" style="padding-left: 15px; font-size: 0.85rem; color: #aaa;"></ul>
      </div>
    </div>

    <!-- MAIN GLOBE -->
    <div id="globe-wrapper">
      <div id="globe-canvas"></div>
    </div>

    <!-- PANEL PHẢI: BLUEPRINT & CHI TIẾT SÂN BAY -->
    <div id="right-panel">
      <div class="panel-content">
        <button class="close-btn" onclick="closePanel()">[X] CLOSE</button>
        <h2 style="color: var(--neon-green); margin-top: 0;" id="bp-name">INSPECTING TERMINAL...</h2>
        <p><strong>CODE:</strong> <span id="bp-code">--</span> | <strong>ELEV:</strong> <span id="bp-elev">--</span> FT | <strong>CTRY:</strong> <span id="bp-country">--</span></p>
        
        <div id="blueprint-canvas"></div>
        
        <div style="margin-top: 15px; font-size: 0.9rem;">
          <p style="color: var(--neon-magenta);">> SCANNING FREQUENCIES...</p>
          <p style="color: var(--neon-cyan);">> LOADING PILOT LOGS & COMMENTS...</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    // TỪ ĐIỂN MAP ISO CODE (Dùng tạm thay cho việc join countries.csv để tăng tốc)
    const countryNames = { "VN": "Vietnam", "US": "United States", "JP": "Japan", "CN": "China", "KR": "South Korea", "GB": "United Kingdom", "FR": "France" };
    
    let globalAirports = [];

    // 1. KHỞI TẠO GLOBE
    const globeElement = document.getElementById('globe-canvas');
    const world = Globe()(globeElement)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .backgroundColor('rgba(0,0,0,0)')
      .showAtmosphere(true)
      .atmosphereColor('#00f3ff')
      .atmosphereAltitude(0.1)
      
      // CẤU HÌNH BIÊN GIỚI QUỐC GIA (OPACITY 50%)
      .polygonAltitude(0.005)
      .polygonCapColor(() => 'rgba(0, 0, 0, 0)') // Nền rỗng
      .polygonStrokeColor(() => 'rgba(0, 243, 255, 0.5)') // Viền 50%
      .polygonSideColor(() => 'rgba(0, 0, 0, 0)')
      
      // SỰ KIỆN HOVER QUỐC GIA
      .onPolygonHover(polygon => {
        // Làm sáng quốc gia đang hover
        world.polygonCapColor(d => d === polygon ? 'rgba(0, 243, 255, 0.2)' : 'rgba(0, 0, 0, 0)');
        
        if (polygon) {
          const iso2 = polygon.properties.ISO_A2 || polygon.properties.iso_a2; // Phụ thuộc vào file custom.geo.json của bạn
          const countryName = polygon.properties.ADMIN || polygon.properties.name || "Unknown";
          
          document.getElementById('hud-country-name').innerText = `[ TERRITORY: ${countryName.toUpperCase()} ]`;
          
          // Lọc danh sách sân bay trong nước đó
          const airportsInCountry = globalAirports.filter(a => a.iso_country === iso2);
          document.getElementById('hud-stats').innerText = `TOTAL TERMINALS: ${airportsInCountry.length}`;
          
          // Hiển thị top 5 sân bay lớn nhất
          const listHtml = airportsInCountry.slice(0, 5).map(a => `<li>${a.ident} - ${a.name}</li>`).join('');
          document.getElementById('hud-airport-list').innerHTML = listHtml + (airportsInCountry.length > 5 ? `<li>...and ${airportsInCountry.length - 5} more</li>` : '');
        }
      })

      // CẤU HÌNH ĐIỂM SÂN BAY
      .pointColor(() => '#ff00ea')
      .pointResolution(16)
      .onPointHover(point => {
        globeElement.style.cursor = point ? 'crosshair' : 'default';
        if (point) {
          const fullCtryName = countryNames[point.iso_country] || point.iso_country;
          world.tooltipContent(() => `
            <div class="globe-tooltip">
              <strong style="color:var(--neon-green)">${point.name}</strong><br>
              ID: ${point.ident} | Type: ${point.type}<br>
              <span style="color:var(--neon-magenta)">Country: ${fullCtryName}</span>
            </div>
          `);
        }
      })
      
      // SỰ KIỆN CLICK SÂN BAY
      .onPointClick(point => {
        openRightPanel(point);
      });

    // CHỈNH TỐC ĐỘ QUAY CHẬM LẠI
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.1; // Chậm và mượt

    // 2. NẠP DỮ LIỆU
    // Nạp biên giới (custom.geo.json)
    fetch('custom.geo.json')
      .then(res => res.json())
      .then(geoData => {
        world.polygonsData(geoData.features);
      }).catch(err => console.log("Missing custom.geo.json", err));

    // Nạp sân bay (airports.csv)
    Papa.parse('airports.csv', {
      download: true, header: true, dynamicTyping: true,
      complete: function(results) {
        globalAirports = results.data.filter(d => d.latitude_deg && (d.type === 'large_airport' || d.type === 'medium_airport'));
        
        const mappedData = globalAirports.map(d => ({
          lat: d.latitude_deg, lng: d.longitude_deg,
          size: d.type === 'large_airport' ? 0.3 : 0.15, // To nhỏ theo size
          ...d
        }));
        
        world.pointsData(mappedData).pointRadius('size');
      }
    });

    // 3. LOGIC UI ĐÓNG MỞ PANEL & RESIZE CAMERA
    function openRightPanel(point) {
      world.controls().autoRotate = false;
      world.pointOfView({ lat: point.lat, lng: point.lng, altitude: 0.8 }, 1000);
      
      document.body.classList.add('panel-open');
      
      // Resize lại width của quả cầu khi bị ép sang trái
      setTimeout(() => {
        const wrapperWidth = document.getElementById('globe-wrapper').clientWidth;
        world.width(wrapperWidth);
      }, 50);

      document.getElementById('bp-name').innerText = `> ${point.name}`;
      document.getElementById('bp-code').innerText = point.iata_code || point.ident;
      document.getElementById('bp-elev').innerText = point.elevation_ft || 'N/A';
      document.getElementById('bp-country').innerText = countryNames[point.iso_country] || point.iso_country;
      
      initBlueprint();
    }

    function closePanel() {
      document.body.classList.remove('panel-open');
      world.controls().autoRotate = true;
      
      setTimeout(() => {
        const wrapperWidth = document.getElementById('globe-wrapper').clientWidth;
        world.width(wrapperWidth);
      }, 50);
    }

    // Resize Window Event
    window.addEventListener('resize', () => {
      const wrapperWidth = document.getElementById('globe-wrapper').clientWidth;
      world.width(wrapperWidth);
      world.height(window.innerHeight);
    });

    // 4. MÔ PHỎNG BLUEPRINT 3D & NÚT CHỨC NĂNG
    let bpScene, bpCamera, bpRenderer, reqAnim;
    function initBlueprint() {
      const container = document.getElementById('blueprint-canvas');
      container.innerHTML = ''; cancelAnimationFrame(reqAnim);
      
      bpScene = new THREE.Scene();
      bpCamera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 100);
      bpCamera.position.set(0, 20, 20); bpCamera.lookAt(0,0,0);
      
      bpRenderer = new THREE.WebGLRenderer({ alpha: true });
      bpRenderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(bpRenderer.domElement);

      const grid = new THREE.GridHelper(50, 25, 0x00ff66, 0x002211);
      bpScene.add(grid);

      // Runway giả lập
      const geo = new THREE.BoxGeometry(4, 0.2, 15);
      const mat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true });
      const runway = new THREE.Mesh(geo, mat);
      bpScene.add(runway);

      function animate() {
        reqAnim = requestAnimationFrame(animate);
        runway.rotation.y += 0.005;
        bpRenderer.render(bpScene, bpCamera);
      }
      animate();
    }

    // Sự kiện Nút tính năng Panel Trái (Giao diện giả lập kích hoạt Data)
    document.getElementById('btn-navaids').onclick = function() {
      this.classList.toggle('active');
      this.innerText = this.classList.contains('active') ? "[-] Navaids & Beacons (ACTIVE)" : "[+] Navaids & Beacons (VOR/NDB)";
      if(this.classList.contains('active')) alert("Tính năng sẵn sàng nạp từ navaids.csv!");
    };
  </script>
</body>
</html>
