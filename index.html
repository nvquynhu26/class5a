<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROVEXIS - Orbital Terminal Blueprints</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-green: #00ff66;
      --neon-yellow: #ffe600;
      --bg-dark: #0a0a0f;
      --hud-bg: rgba(10, 10, 15, 0.95);
      --hud-border: 1px solid var(--neon-cyan);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
      overflow: hidden;
    }

    #header {
      position: absolute; top: 20px; left: 30px; z-index: 10;
      pointer-events: none;
    }
    #header h1 {
      margin: 0; font-size: 2.2rem; letter-spacing: 4px;
      text-shadow: 0 0 10px var(--neon-cyan);
    }
    #header p {
      margin: 5px 0 0 0; font-size: 0.85rem; color: #888;
      letter-spacing: 2px;
    }

    #layout-container {
      display: flex; width: 100%; height: 100%;
    }
    #globe-container {
      width: 100%; height: 100%;
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    #side-panel {
      width: 0%; height: 100%;
      background: var(--hud-bg);
      border-left: var(--hud-border);
      box-shadow: -5px 0 20px rgba(0, 243, 255, 0.2);
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex; flex-direction: column;
      overflow-y: auto; z-index: 5;
    }
    .panel-content {
      padding: 30px; width: 100vw; max-width: 50vw; opacity: 0;
      transition: opacity 0.4s; box-sizing: border-box;
    }

    body.panel-open #globe-container { width: 50%; }
    body.panel-open #side-panel { width: 50%; }
    body.panel-open .panel-content { opacity: 1; transition-delay: 0.3s; }

    /* KHUNG BLUEPRINT 3D */
    #blueprint-view {
      width: 100%;
      height: 380px;
      border: 1px dashed var(--neon-green);
      margin-top: 15px;
      position: relative;
      background: radial-gradient(circle, rgba(0, 255, 102, 0.05) 0%, rgba(5, 10, 15, 0.8) 100%);
      overflow: hidden;
    }

    .hud-title {
      font-size: 1.4rem; border-bottom: 1px solid var(--neon-cyan);
      padding-bottom: 8px; margin-bottom: 16px;
    }
    .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: transparent; color: var(--neon-pink);
      border: 1px solid var(--neon-pink);
      padding: 6px 14px; cursor: pointer; font-family: inherit;
    }
    .close-btn:hover { background: var(--neon-pink); color: #fff; }
    .status-text { color: var(--neon-green); font-size: 0.85rem; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="header">
    <h1>AEROVEXIS</h1>
    <p>Global Aeronautical Intelligence & Orbital Terminal Blueprints</p>
  </div>

  <div id="layout-container">
    <div id="globe-container"></div>
    
    <div id="side-panel">
      <div class="panel-content">
        <button class="close-btn" onclick="closePanel()">[ ESC / CLOSE ]</button>
        <div class="hud-title" id="airport-name">TERMINAL LOCKED</div>
        <p><strong>CODE:</strong> <span id="airport-code">---</span></p>
        <p><strong>ELEVATION:</strong> <span id="airport-elev">---</span> ft</p>
        <p><strong>COUNTRY:</strong> <span id="airport-country" style="color: #fff">---</span></p>
        <p><strong>MUNICIPALITY:</strong> <span id="airport-municipality">---</span></p>
        <p><strong>CONNECTED ROUTES:</strong> <span id="airport-routes" style="color: var(--neon-green)">---</span></p>
        
        <div id="blueprint-view"></div>
        <div class="status-text">> RUNWAY ALIGNMENT SENSORS ACTIVE (ROTATING 360°)</div>
      </div>
    </div>
  </div>

  <script>
    const globeContainer = document.getElementById('globe-container');
    
    let airportsMap = new Map();
    let airportsList = [];
    let countriesMap = new Map();
    let runwaysList = [];
    let routesList = [];
    let selectedAirport = null;
    let connectedAirportIds = new Set();

    // 1. KHỞI TẠO ĐỊA CẦU
    const world = Globe()(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .backgroundColor('#0a0a0f')
      .showAtmosphere(true)
      .atmosphereColor('#00f3ff')
      .atmosphereAltitude(0.12)
      
      .pointLat('latitude_deg')
      .pointLng('longitude_deg')
      .pointAltitude(0)
      
      // Phân biệt kích thước rõ rệt
      .pointRadius(d => {
        if (!selectedAirport) {
          return d.type === 'large_airport' ? 0.42 : 0.16;
        }
        if (d.ident === selectedAirport.ident) return 0.65;
        if (connectedAirportIds.has(d.iata_code) || connectedAirportIds.has(d.ident)) return 0.35;
        return 0.08;
      })
      
      // Phân biệt màu sắc rõ ràng (Lớn: Vàng, Vừa: Cyan)
      .pointColor(d => {
        if (!selectedAirport) {
          return d.type === 'large_airport' ? '#ffe600' : '#00f3ff';
        }
        if (d.ident === selectedAirport.ident) return '#ff0055'; // Đang chọn: Hồng
        if (connectedAirportIds.has(d.iata_code) || connectedAirportIds.has(d.ident)) return '#00ff66'; // Kết nối: Xanh lá
        return 'rgba(50, 60, 80, 0.25)'; // Không liên quan: Tối mờ
      })
      .pointResolution(6)
      
      // ĐƯỜNG BAY: SIÊU MỎNG (1-2px) VÀ ĐỨNG YÊN HOÀN TOÀN
      .arcColor(() => ['#ff0055', '#00ff66'])
      .arcAltitude(0.2)
      .arcStroke(0.12) // Mỏng chừng 1-2px
      .arcDashLength(1) // Liền khối, không ngắt quãng
      .arcDashGap(0)
      .arcDashAnimateTime(0) // ĐỨNG YÊN HOÀN TOÀN
      .onPointClick(point => {
        if (point) handleAirportSelect(point);
      });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.12;
    world.controls().enableDamping = true;

    // 2. TẢI TOÀN BỘ FILE CSV ĐỒNG THỜI
    Promise.all([
      fetchCSV('countries.csv'),
      fetchCSV('airports.csv'),
      fetchCSV('runways.csv'),
      fetchRoutes('routes.dat')
    ]).then(([countries, airports, runways, routes]) => {
      countries.forEach(c => countriesMap.set(c.code, c.name));

      airportsList = airports.filter(d => 
        d.latitude_deg && d.longitude_deg &&
        (d.type === 'large_airport' || d.type === 'medium_airport')
      );
      
      airportsList.forEach(a => {
        if (a.ident) airportsMap.set(a.ident, a);
        if (a.iata_code) airportsMap.set(a.iata_code, a);
      });

      runwaysList = runways;
      routesList = routes;

      world.pointsData(airportsList);
      console.log("System Ready.");
    });

    function fetchCSV(filename) {
      return new Promise(resolve => {
        Papa.parse(filename, {
          download: true, header: true, dynamicTyping: true,
          complete: res => resolve(res.data)
        });
      });
    }

    function fetchRoutes(filename) {
      return new Promise(resolve => {
        Papa.parse(filename, {
          download: true, header: false, dynamicTyping: true,
          complete: res => {
            const clean = res.data.map(r => ({ src: r[2], dst: r[4] })).filter(r => r.src && r.dst);
            resolve(clean);
          }
        });
      });
    }

    // 3. XỬ LÝ CHỌN SÂN BAY & VẼ ĐƯỜNG BAY TĨNH
    function handleAirportSelect(point) {
      selectedAirport = point;
      connectedAirportIds.clear();

      const matchedRoutes = [];
      const codeIATA = point.iata_code;
      const codeICAO = point.ident;

      routesList.forEach(r => {
        if (r.src === codeIATA || r.src === codeICAO) {
          const target = airportsMap.get(r.dst);
          if (target) {
            connectedAirportIds.add(r.dst);
            matchedRoutes.push({
              startLat: point.latitude_deg, startLng: point.longitude_deg,
              endLat: target.latitude_deg, endLng: target.longitude_deg
            });
          }
        } else if (r.dst === codeIATA || r.dst === codeICAO) {
          const origin = airportsMap.get(r.src);
          if (origin) {
            connectedAirportIds.add(r.src);
            matchedRoutes.push({
              startLat: origin.latitude_deg, startLng: origin.longitude_deg,
              endLat: point.latitude_deg, endLng: point.longitude_deg
            });
          }
        }
      });

      world.arcsData(matchedRoutes);
      world.pointsData([...airportsList]);

      openPanel(point, matchedRoutes.length);
    }

    // 4. MỞ PANEL BÊN PHẢI
    function openPanel(point, routeCount) {
      world.controls().autoRotate = false;
      world.pointOfView({ lat: point.latitude_deg, lng: point.longitude_deg, altitude: 1.2 }, 800);

      document.body.classList.add('panel-open');

      const countryName = countriesMap.get(point.iso_country) || point.iso_country || 'N/A';
      document.getElementById('airport-name').innerText = `> ${point.name || 'UNKNOWN'}`;
      document.getElementById('airport-code').innerText = `${point.ident || '---'} / ${point.iata_code || '---'}`;
      document.getElementById('airport-elev').innerText = point.elevation_ft || 'N/A';
      document.getElementById('airport-country').innerText = countryName;
      document.getElementById('airport-municipality').innerText = point.municipality || 'N/A';
      document.getElementById('airport-routes').innerText = `${routeCount} Direct Routes`;

      setTimeout(() => {
        world.width(window.innerWidth / 2);
        // Khởi tạo và ép vẽ Blueprint
        initBlueprint(point.ident);
      }, 350);
    }

    function closePanel() {
      document.body.classList.remove('panel-open');
      world.controls().autoRotate = true;
      selectedAirport = null;
      connectedAirportIds.clear();

      world.arcsData([]);
      world.pointsData([...airportsList]);

      setTimeout(() => {
        world.width(window.innerWidth);
      }, 100);

      if (blueprintRenderer) {
        document.getElementById('blueprint-view').innerHTML = '';
        cancelAnimationFrame(reqAnim);
      }
    }

    window.addEventListener('resize', () => {
      world.width(document.body.classList.contains('panel-open') ? window.innerWidth / 2 : window.innerWidth);
      world.height(window.innerHeight);
    });

    // 5. BLUEPRINT 3D ĐƯỢC ÉP HIỂN THỊ CHUẨN XÁC
    let blueprintScene, blueprintCamera, blueprintRenderer, reqAnim, blueprintGroup;

    function initBlueprint(airportIdent) {
      const container = document.getElementById('blueprint-view');
      container.innerHTML = '';
      cancelAnimationFrame(reqAnim);

      // Lấy kích thước thật của container sau khi trượt ra
      const width = container.clientWidth || (window.innerWidth * 0.45);
      const height = container.clientHeight || 380;

      blueprintScene = new THREE.Scene();
      blueprintCamera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      blueprintCamera.position.set(0, 65, 65);
      blueprintCamera.lookAt(0, 0, 0);

      blueprintRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      blueprintRenderer.setSize(width, height);
      blueprintRenderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(blueprintRenderer.domElement);

      // Thêm ánh sáng
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      blueprintScene.add(ambientLight);

      // Lưới mặt đất
      const gridHelper = new THREE.GridHelper(120, 24, 0x00ff66, 0x003311);
      blueprintScene.add(gridHelper);

      blueprintGroup = new THREE.Group();

      // Lọc đường băng từ runways.csv
      const airportRunways = runwaysList.filter(r => r.airport_ident === airportIdent);

      const runwayMaterial = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true });
      const towerMaterial = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });

      if (airportRunways.length > 0) {
        airportRunways.forEach(r => {
          const len = (r.length_ft || 7000) / 100;
          const wid = Math.max((r.width_ft || 150) / 25, 2.5);
          const headingRad = (r.heading_degT || 0) * (Math.PI / 180);

          const rGeo = new THREE.BoxGeometry(wid, 0.4, len);
          const rMesh = new THREE.Mesh(rGeo, runwayMaterial);
          rMesh.rotation.y = -headingRad; // Xoay theo góc la bàn thật của sân bay
          blueprintGroup.add(rMesh);
        });
      } else {
        // Mô hình đường băng mặc định nếu file không có dữ liệu chi tiết
        const defaultRw1 = new THREE.BoxGeometry(4, 0.4, 65);
        const rMesh1 = new THREE.Mesh(defaultRw1, runwayMaterial);
        rMesh1.rotation.y = Math.PI / 6;
        blueprintGroup.add(rMesh1);
      }

      // Mô hình tháp không lưu (ATC Tower)
      const towerGeo = new THREE.CylinderGeometry(2, 3.5, 16, 8);
      const towerMesh = new THREE.Mesh(towerGeo, towerMaterial);
      towerMesh.position.set(18, 8, 0);
      blueprintGroup.add(towerMesh);

      // Nhà ga (Terminal Block)
      const termGeo = new THREE.BoxGeometry(16, 4, 10);
      const termMesh = new THREE.Mesh(termGeo, new THREE.MeshBasicMaterial({ color: 0xffe600, wireframe: true }));
      termMesh.position.set(18, 2, -15);
      blueprintGroup.add(termMesh);

      blueprintScene.add(blueprintGroup);

      // Vòng lặp xoay 360 độ
      function animate() {
        reqAnim = requestAnimationFrame(animate);
        blueprintGroup.rotation.y += 0.006;
        blueprintRenderer.render(blueprintScene, blueprintCamera);
      }
      animate();
    }
  </script>
</body>
</html>
