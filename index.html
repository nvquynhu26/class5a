<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROVEXIS - Orbital Terminal Blueprints</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ea;
      --neon-green: #00ff66;
      --bg-dark: #050508;
      --hud-bg: rgba(5, 5, 10, 0.9);
      --hud-border: 1px solid var(--neon-cyan);
    }

    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background-color: var(--bg-dark); font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan); overflow: hidden;
    }

    /* MÀN HÌNH LOADING TRÁNH ĐỨNG MÁY */
    #loader {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-dark); z-index: 100;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: opacity 0.5s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .spinner { border: 4px solid rgba(0, 243, 255, 0.1); border-top: 4px solid var(--neon-cyan); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px;}
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #header { position: absolute; top: 20px; left: 30px; z-index: 20; pointer-events: none; }
    #header h1 { margin: 0; font-size: 2.5rem; letter-spacing: 4px; text-shadow: 0 0 10px var(--neon-cyan); }
    #header p { margin: 5px 0 0 0; font-size: 0.9rem; color: #aaa; text-transform: uppercase; letter-spacing: 2px; }

    #layout-container { position: relative; width: 100vw; height: 100vh; }
    
    #globe-wrapper {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #side-panel {
      position: absolute; top: 0; right: 0;
      width: 45vw; height: 100vh; background: var(--hud-bg);
      border-left: var(--hud-border); box-shadow: -10px 0 30px rgba(0, 243, 255, 0.1);
      transform: translateX(100%); transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 30; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
    }
    .panel-content { padding: 40px; }

    body.panel-open #globe-wrapper { transform: translateX(-20vw); }
    body.panel-open #side-panel { transform: translateX(0); }

    .aero-tooltip {
      background: rgba(5, 5, 10, 0.95); border: 1px solid var(--neon-cyan);
      padding: 12px; border-radius: 4px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); pointer-events: none;
    }

    #blueprint-view { width: 100%; height: 350px; border: 1px dashed var(--neon-green); margin-top: 20px; position: relative; background: #000; }
    .hud-title { font-size: 1.8rem; border-bottom: 1px solid var(--neon-cyan); padding-bottom: 10px; margin-top: 0; }
    
    .close-btn {
      position: absolute; top: 20px; right: 30px; background: transparent; color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta); padding: 8px 20px; cursor: pointer; font-family: inherit; font-weight: bold;
    }
    .close-btn:hover { background: var(--neon-magenta); color: #fff; box-shadow: 0 0 15px var(--neon-magenta); }
  </style>
</head>
<body>

  <!-- LOADING OVERLAY -->
  <div id="loader">
    <div class="spinner"></div>
    <h2 id="load-text">INITIALIZING SATELLITE LINK...</h2>
  </div>

  <div id="header">
    <h1>AEROVEXIS</h1>
    <p>Orbital Terminal Blueprints</p>
  </div>

  <div id="layout-container">
    <div id="globe-wrapper">
        <div id="globe-container"></div>
    </div>
    
    <div id="side-panel">
      <div class="panel-content">
        <button class="close-btn" onclick="closePanel()">[ RESET SCAN ]</button>
        <h2 class="hud-title" id="airport-name">SYSTEM READY...</h2>
        <p><strong>IATA / ICAO :</strong> <span id="airport-code" style="color:#fff">---</span></p>
        <p><strong>ELEVATION :</strong> <span id="airport-elev" style="color:#fff">---</span> ft</p>
        <p><strong>COUNTRY :</strong> <span id="airport-country" style="color:#fff">---</span></p>
        <p><strong>CONNECTIONS :</strong> <span id="airport-routes" style="color:var(--neon-magenta)">0 routes found</span></p>
        
        <div id="blueprint-view"></div>
        <div style="margin-top: 20px; color: #888">> DISPLAYING BLUEPRINT SCHEMATIC...</div>
      </div>
    </div>
  </div>

  <script>
    // URL raw trực tiếp để chống lỗi CORS (Không chạy local server vẫn load được)
    const AIRPORTS_URL = 'https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/airports.csv';
    const ROUTES_URL = 'https://raw.githubusercontent.com/jpatokal/openflights/master/data/routes.dat';
    const GEOJSON_URL = 'https://raw.githubusercontent.com/nvquynhu26/class5a/main/custom.geo.json';

    // Biến lưu trữ dữ liệu
    let allAirports = [];
    let airportMap = {}; // Tra cứu nhanh sân bay
    let routesMap = {}; // Tra cứu chuyến bay theo điểm đi

    // Khởi tạo địa cầu
    const globeContainer = document.getElementById('globe-container');
    const world = Globe()(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .backgroundColor('#050508')
      .pointAltitude(0.001) // Điểm dẹt
      .pointColor(d => d.type === 'large_airport' ? '#00ff66' : '#00f3ff')
      .pointResolution(16)
      .onPointHover(point => {
        globeContainer.style.cursor = point ? 'pointer' : 'default';
        if (point) {
          world.tooltipContent(() => `
            <div class="aero-tooltip">
              <strong style="color:var(--neon-green)">${point.name}</strong><br>
              <span style="color:#aaa">Code:</span> <span style="color:#fff">${point.iata_code || point.ident}</span>
            </div>
          `);
        }
      })
      .onPointClick(point => openPanel(point))
      // Tương tác khi hover vào đường bay
      .onArcHover(arc => {
        if(arc) {
          world.tooltipContent(() => `
            <div class="aero-tooltip" style="border-color: var(--neon-magenta)">
              <strong style="color:var(--neon-magenta)">FLIGHT ROUTE</strong><br>
              Airline Code: <span style="color:#fff">${arc.airline}</span><br>
              Route: <span style="color:#fff">${arc.srcIata} ➝ ${arc.dstIata}</span>
            </div>
          `);
        }
      });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    // QUY TRÌNH TẢI VÀ XỬ LÝ DỮ LIỆU ĐỒNG THỜI (PROMISES)
    Promise.all([
      fetch(AIRPORTS_URL).then(r => r.text()),
      fetch(ROUTES_URL).then(r => r.text()),
      fetch(GEOJSON_URL).then(r => r.json()).catch(() => null)
    ]).then(([airportsCsv, routesCsv, geoJson]) => {
      
      document.getElementById('load-text').innerText = "PROCESSING DATABASE...";

      // 1. Nạp bản đồ quốc gia (Chỉ viền, bỏ hover, opacity cực mờ)
      if (geoJson) {
        world.polygonsData(geoJson.features)
             .polygonAltitude(0.001)
             .polygonCapColor(() => 'rgba(0,0,0,0)') // Trống bên trong
             .polygonSideColor(() => 'rgba(0,0,0,0)')
             .polygonStrokeColor(() => 'rgba(0, 243, 255, 0.1)'); // Viền siêu mờ
      }

      // 2. Phân tích Airports
      Papa.parse(airportsCsv, {
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true,
        complete: function(res) {
          res.data.forEach(d => {
            // Chỉ lấy sân bay thương mại để giảm tải
            if (d.latitude_deg && d.longitude_deg && (d.type === 'large_airport' || d.type === 'medium_airport')) {
              d.size = d.type === 'large_airport' ? 0.25 : 0.08;
              d.lat = d.latitude_deg;
              d.lng = d.longitude_deg;
              
              allAirports.push(d);
              
              // Tạo từ điển để tìm kiếm nhanh
              if (d.iata_code) airportMap[d.iata_code] = d;
              if (d.ident) airportMap[d.ident] = d; // Back-up
            }
          });
          world.pointsData(allAirports).pointRadius('size');
        }
      });

      // 3. Phân tích Routes
      Papa.parse(routesCsv, {
        header: false, // routes.dat không có header
        skipEmptyLines: true,
        complete: function(res) {
          res.data.forEach(row => {
            // row[0] = Airline, row[2] = Source, row[4] = Destination
            const airline = row[0];
            const source = row[2];
            const dest = row[4];

            if (!routesMap[source]) routesMap[source] = [];
            routesMap[source].push({ dest: dest, airline: airline });
          });
        }
      });

      // Ẩn Loading
      document.getElementById('loader').classList.add('hidden');
    });

    // --- LOGIC MỞ BẢNG & HIỂN THỊ ĐƯỜNG BAY ---
    let activeArcs = [];

    function openPanel(point) {
      world.controls().autoRotate = false;
      world.pointOfView({ lat: point.lat, lng: point.lng, altitude: 0.8 }, 1000);
      document.body.classList.add('panel-open');
      
      const code = point.iata_code || point.ident;
      
      // Tìm các đường bay từ sân bay này
      const routes = routesMap[code] || [];
      activeArcs = [];
      let connectedAirports = new Set([point]); // Lưu các sân bay có liên quan

      routes.forEach(route => {
        const destAirport = airportMap[route.dest];
        if (destAirport) {
          activeArcs.push({
            startLat: point.lat,
            startLng: point.lng,
            endLat: destAirport.lat,
            endLng: destAirport.lng,
            airline: route.airline,
            srcIata: code,
            dstIata: route.dest
          });
          connectedAirports.add(destAirport);
        }
      });

      // Cập nhật thông tin UI
      document.getElementById('airport-name').innerText = `> ${point.name || 'UNKNOWN'}`;
      document.getElementById('airport-code').innerText = code;
      document.getElementById('airport-elev').innerText = point.elevation_ft || '0';
      document.getElementById('airport-country').innerText = point.iso_country || 'N/A';
      document.getElementById('airport-routes').innerText = `${activeArcs.length} active routes`;

      // VẼ ĐƯỜNG BAY (ARCS)
      world.arcsData(activeArcs)
           .arcColor(() => '#ff00ea') // Màu hồng Neon
           .arcDashLength(0.4)
           .arcDashGap(0.2)
           .arcDashAnimateTime(1500)
           .arcStroke(0.6);

      // LÀM MỜ SÂN BAY KHÔNG LIÊN QUAN
      world.pointColor(d => {
        if (connectedAirports.has(d)) {
          return d.type === 'large_airport' ? '#00ff66' : '#00f3ff'; // Giữ màu cho sân bay liên quan
        }
        return 'rgba(50, 50, 50, 0.1)'; // Làm mờ đục sân bay khác
      });

      initBlueprint();
    }

    // ĐÓNG PANEL (RESET TRẠNG THÁI)
    function closePanel() {
      document.body.classList.remove('panel-open');
      world.controls().autoRotate = true;
      
      // Xóa đường bay
      world.arcsData([]);
      // Phục hồi màu tất cả sân bay
      world.pointColor(d => d.type === 'large_airport' ? '#00ff66' : '#00f3ff');

      if (blueprintRenderer) {
        cancelAnimationFrame(reqAnim);
        document.getElementById('blueprint-view').innerHTML = '';
      }
    }

    // --- BLUEPRINT RENDERER ---
    let blueprintScene, blueprintCamera, blueprintRenderer, reqAnim;
    function initBlueprint() {
      const container = document.getElementById('blueprint-view');
      container.innerHTML = ''; cancelAnimationFrame(reqAnim);

      blueprintScene = new THREE.Scene();
      const w = container.clientWidth, h = container.clientHeight;
      blueprintCamera = new THREE.PerspectiveCamera(45, w/h, 0.1, 1000);
      blueprintCamera.position.set(0, 40, 40); blueprintCamera.lookAt(0, 0, 0);

      blueprintRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      blueprintRenderer.setSize(w, h); container.appendChild(blueprintRenderer.domElement);

      blueprintScene.add(new THREE.GridHelper(80, 40, 0x00ff66, 0x003311));

      const runwayMesh = new THREE.Mesh(
        new THREE.BoxGeometry(8, 0.2, 35), 
        new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true })
      );
      const terminalMesh = new THREE.Mesh(
        new THREE.BoxGeometry(10, 4, 8), 
        new THREE.MeshBasicMaterial({ color: 0xff00ea, wireframe: true })
      );
      terminalMesh.position.set(10, 2, 0);
      
      blueprintScene.add(runwayMesh); blueprintScene.add(terminalMesh);

      function animate() {
        reqAnim = requestAnimationFrame(animate);
        runwayMesh.rotation.y += 0.008; terminalMesh.rotation.y += 0.008;
        blueprintRenderer.render(blueprintScene, blueprintCamera);
      }
      animate();
    }
  </script>
</body>
</html>
