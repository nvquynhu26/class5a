<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROVEXIS - Orbital Terminal Blueprints</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ea;
      --neon-green: #00ff66;
      --bg-dark: #050508;
      --hud-bg: rgba(5, 5, 8, 0.9);
      --hud-border: 1px solid var(--neon-cyan);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
      overflow: hidden;
    }

    #header {
      position: absolute; top: 20px; left: 30px; z-index: 10;
      pointer-events: none; text-shadow: 0 0 10px rgba(0,243,255,0.5);
    }
    #header h1 { margin: 0; font-size: 2.5rem; letter-spacing: 4px; }
    #header p { margin: 5px 0 0 0; font-size: 0.9rem; color: #888; }

    #layout-container { display: flex; width: 100%; height: 100%; }
    
    /* Container của Trái Đất - Chuyển động mượt bằng transform thay vì đổi width để tránh re-render lag */
    #globe-wrapper {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform; /* Tối ưu hóa GPU */
    }
    #globe-container { width: 100%; height: 100%; }

    #side-panel {
      position: absolute; right: 0; top: 0;
      width: 50%; height: 100%;
      background: var(--hud-bg);
      border-left: var(--hud-border);
      box-shadow: -10px 0 30px rgba(0, 243, 255, 0.1);
      transform: translateX(100%);
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex; flex-direction: column;
      z-index: 5; will-change: transform;
    }
    
    .panel-content { padding: 40px; overflow-y: auto; height: 100%; }

    /* Trạng thái khi click Sân bay */
    body.panel-open #globe-wrapper { transform: translateX(-25%); }
    body.panel-open #side-panel { transform: translateX(0); }

    .aero-tooltip {
      background: rgba(0,0,0,0.8); border: 1px solid var(--neon-green);
      padding: 12px; border-radius: 4px; color: #fff;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
      pointer-events: none;
    }

    #blueprint-view {
      width: 100%; height: 350px;
      border: 1px dashed var(--neon-magenta);
      margin: 20px 0; background: rgba(0,0,0,0.5);
    }
    
    .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: transparent; color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta); padding: 8px 20px;
      cursor: pointer; font-family: inherit; font-size: 1rem;
      transition: all 0.3s;
    }
    .close-btn:hover { background: var(--neon-magenta); color: #fff; }
    
    #loading-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 2rem; color: var(--neon-green); z-index: 99; text-shadow: 0 0 20px var(--neon-green);
    }
  </style>
</head>
<body>

  <div id="loading-overlay">INITIALIZING GLOBAL RADAR...</div>

  <div id="header">
    <h1>AEROVEXIS</h1>
    <p>Global Aeronautical Intelligence & Orbital Terminal Blueprints</p>
  </div>

  <div id="layout-container">
    <div id="globe-wrapper">
      <div id="globe-container"></div>
    </div>
    
    <div id="side-panel">
      <div class="panel-content">
        <button class="close-btn" onclick="closePanel()">[ CLOSE ]</button>
        <h2 style="color:var(--neon-cyan); border-bottom:1px solid; padding-bottom:10px;" id="airport-name">TERMINAL</h2>
        <p><strong>CODE:</strong> <span id="airport-code">---</span></p>
        <p><strong>COUNTRY:</strong> <span id="airport-country">---</span></p>
        
        <div id="blueprint-view"></div>
        <p style="color: var(--neon-green)">> AWAITING TELEMETRY DATA...</p>
      </div>
    </div>
  </div>

  <script>
    // 1. TỐI ƯU QUẢ ĐỊA CẦU
    const globeContainer = document.getElementById('globe-container');
    const world = Globe({ animateIn: false })(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .backgroundColor('rgba(0,0,0,0)')
      .pointAltitude(0.005)
      .pointColor(d => d.type === 'large_airport' ? '#ff00ea' : '#00f3ff')
      .pointResolution(12) // Giảm số mặt polygon của mỗi chấm để chống lag (Cực kỳ quan trọng)
      .showAtmosphere(true)
      .atmosphereColor('#00f3ff')
      .atmosphereAltitude(0.15)
      .onPointHover(point => {
        globeContainer.style.cursor = point ? 'pointer' : 'default';
        if (point) {
          // Hover hiện thông tin quốc gia và sân bay
          world.tooltipContent(() => `
            <div class="aero-tooltip">
              <span style="color:var(--neon-green); font-size:1.2rem;">${point.iso_country}</span><br>
              <strong>${point.name}</strong><br>
              Type: ${point.type.replace('_', ' ')}
            </div>
          `);
        }
      })
      .onPointClick(point => openPanel(point));

    // Quay chậm Trái Đất (0.15 thay vì 0.5)
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.15;
    world.controls().enableDamping = true; // Làm mượt khi dùng chuột xoay

    // 2. TẢI DỮ LIỆU ĐA LUỒNG (WORKER) ĐỂ TRÁNH ĐƠ TRÌNH DUYỆT
    Papa.parse('airports.csv', {
      download: true,
      header: true,
      dynamicTyping: true,
      worker: true, // Đẩy việc đọc file CSV sang luồng phụ (Web Worker)
      complete: function(results) {
        // Chỉ lọc sân bay lớn và vừa để tối ưu FPS
        const validAirports = results.data.filter(d => 
          d.latitude_deg && d.longitude_deg && 
          (d.type === 'large_airport' || d.type === 'medium_airport')
        );

        const mappedData = validAirports.map(d => ({
          lat: d.latitude_deg,
          lng: d.longitude_deg,
          size: d.type === 'large_airport' ? 0.3 : 0.1, // Sân bay to -> chấm to
          ...d
        }));

        world.pointsData(mappedData).pointRadius('size');
        document.getElementById('loading-overlay').style.display = 'none';
      }
    });

    // 3. LOGIC GIAO DIỆN MƯỢT MÀ
    let blueprintScene, blueprintRenderer, reqAnim;

    function openPanel(point) {
      document.body.classList.add('panel-open');
      
      // Khóa xoay tự động và di chuyển camera đến điểm click
      world.controls().autoRotate = false;
      world.pointOfView({ lat: point.lat, lng: point.lng, altitude: 0.8 }, 800);

      document.getElementById('airport-name').innerText = `> ${point.name}`;
      document.getElementById('airport-code').innerText = `${point.iata_code || point.ident}`;
      document.getElementById('airport-country').innerText = point.iso_country;

      initBlueprint();
    }

    function closePanel() {
      document.body.classList.remove('panel-open');
      world.controls().autoRotate = true;
      
      // Xóa scene 3D để giải phóng RAM (Chống rò rỉ bộ nhớ gây lag)
      if (reqAnim) cancelAnimationFrame(reqAnim);
      if (blueprintRenderer) {
        blueprintRenderer.dispose();
        document.getElementById('blueprint-view').innerHTML = '';
      }
    }

    // 4. MÔ PHỎNG BLUEPRINT 3D
    function initBlueprint() {
      const container = document.getElementById('blueprint-view');
      container.innerHTML = '';
      if (reqAnim) cancelAnimationFrame(reqAnim);

      blueprintScene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 30, 40);
      camera.lookAt(0, 0, 0);

      blueprintRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: false }); // Tắt antialias để render nhanh hơn
      blueprintRenderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(blueprintRenderer.domElement);

      const grid = new THREE.GridHelper(60, 30, 0x00f3ff, 0x003344);
      blueprintScene.add(grid);

      // Khối đường băng giả lập
      const geo = new THREE.BoxGeometry(4, 0.1, 20);
      const mat = new THREE.MeshBasicMaterial({ color: 0xff00ea, wireframe: true });
      const mesh = new THREE.Mesh(geo, mat);
      blueprintScene.add(mesh);

      function animate() {
        reqAnim = requestAnimationFrame(animate);
        mesh.rotation.y += 0.01;
        blueprintRenderer.render(blueprintScene, camera);
      }
      animate();
    }

    window.addEventListener('resize', () => {
      world.width(window.innerWidth);
      world.height(window.innerHeight);
    });
  </script>
</body>
</html>
