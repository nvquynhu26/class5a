<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROVEXIS - Orbital Terminal Blueprints</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff007f;
      --neon-green: #00ff66;
      --bg-dark: #07070a;
      --hud-bg: rgba(10, 10, 15, 0.96);
      --hud-border: 1px solid var(--neon-cyan);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
      overflow: hidden;
    }

    #header {
      position: absolute; top: 20px; left: 30px; z-index: 10;
      pointer-events: none;
    }
    #header h1 {
      margin: 0; font-size: 2.2rem; letter-spacing: 4px;
      text-shadow: 0 0 10px var(--neon-cyan);
    }
    #header p {
      margin: 5px 0 0 0; font-size: 0.85rem; color: #888;
      letter-spacing: 2px;
    }

    /* BẢNG CHÚ THÍCH MÀU SẮC (LEGEND) */
    #legend {
      position: absolute; bottom: 25px; left: 30px; z-index: 10;
      background: rgba(10, 10, 15, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 10px 15px; font-size: 0.8rem;
      pointer-events: none;
    }
    .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; display: inline-block; }

    #layout-container {
      display: flex; width: 100%; height: 100%;
    }
    #globe-container {
      width: 100%; height: 100%;
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    #side-panel {
      width: 0%; height: 100%;
      background: var(--hud-bg);
      border-left: var(--hud-border);
      box-shadow: -5px 0 20px rgba(0, 243, 255, 0.2);
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex; flex-direction: column;
      overflow-y: auto; z-index: 5;
    }
    .panel-content {
      padding: 30px; width: 100vw; max-width: 50vw; opacity: 0;
      transition: opacity 0.4s; box-sizing: border-box;
    }

    body.panel-open #globe-container { width: 50%; }
    body.panel-open #side-panel { width: 50%; }
    body.panel-open .panel-content { opacity: 1; transition-delay: 0.3s; }

    #blueprint-view {
      width: 100%; height: 320px;
      border: 1px dashed var(--neon-green);
      margin-top: 15px; position: relative;
      background: #020b06;
      box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.1);
    }
    .hud-title {
      font-size: 1.3rem; border-bottom: 1px solid var(--neon-cyan);
      padding-bottom: 8px; margin-bottom: 16px; color: #fff;
    }
    .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: transparent; color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta);
      padding: 6px 14px; cursor: pointer; font-family: inherit;
    }
    .close-btn:hover { background: var(--neon-magenta); color: #fff; }
    .status-text { color: var(--neon-green); font-size: 0.8rem; margin-top: 8px; }
  </style>
</head>
<body>

  <div id="header">
    <h1>AEROVEXIS</h1>
    <p>Global Aeronautical Intelligence & Orbital Terminal Blueprints</p>
  </div>

  <div id="legend">
    <div class="legend-item"><span class="legend-dot" style="background: #ff007f;"></span> LARGE AIRPORT</div>
    <div class="legend-item"><span class="legend-dot" style="background: #00f3ff;"></span> MEDIUM AIRPORT</div>
    <div class="legend-item"><span class="legend-dot" style="background: #ffff00;"></span> SELECTED / CONNECTIONS</div>
  </div>

  <div id="layout-container">
    <div id="globe-container"></div>
    
    <div id="side-panel">
      <div class="panel-content">
        <button class="close-btn" onclick="closePanel()">[ ESC / CLOSE ]</button>
        <div class="hud-title" id="airport-name">TERMINAL LOCKED</div>
        <p><strong>CODE:</strong> <span id="airport-code" style="color:#fff">---</span></p>
        <p><strong>ELEVATION:</strong> <span id="airport-elev">---</span> ft</p>
        <p><strong>COUNTRY:</strong> <span id="airport-country" style="color: var(--neon-cyan)">---</span></p>
        <p><strong>MUNICIPALITY:</strong> <span id="airport-municipality">---</span></p>
        <p><strong>COMMERCIAL ROUTES:</strong> <span id="airport-routes" style="color: var(--neon-magenta)">---</span></p>
        
        <div id="blueprint-view"></div>
        <div class="status-text">> RUNWAY ARCHITECTURE // 3D BLUEPRINT ACTIVE</div>
      </div>
    </div>
  </div>

  <script>
    const globeContainer = document.getElementById('globe-container');
    
    let airportsMap = new Map();
    let airportsList = [];
    let countriesMap = new Map();
    let runwaysList = [];
    let routesList = [];
    let selectedAirportId = null;
    let connectedAirportIds = new Set();

    // 1. KHỞI TẠO ĐỊA CẦU
    const world = Globe()(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .backgroundColor('#07070a')
      .showAtmosphere(true)
      .atmosphereColor('#00f3ff')
      .atmosphereAltitude(0.12)
      
      // Chấm phẳng sát bề mặt
      .pointLat('latitude_deg')
      .pointLng('longitude_deg')
      .pointAltitude(0)
      .pointRadius(d => {
        if (!selectedAirportId) {
          return d.type === 'large_airport' ? 0.38 : 0.16;
        }
        if (d.ident === selectedAirportId) return 0.65;
        if (connectedAirportIds.has(d.iata_code) || connectedAirportIds.has(d.ident)) return 0.35;
        return 0.08; // Thu nhỏ các điểm không liên quan
      })
      .pointColor(d => {
        if (!selectedAirportId) {
          // Phân biệt màu rõ ràng: Lớn = Hồng Neon, Vừa = Cyan
          return d.type === 'large_airport' ? '#ff007f' : '#00f3ff';
        }
        if (d.ident === selectedAirportId) return '#ffffff'; // Điểm chọn: Trắng phát sáng
        if (connectedAirportIds.has(d.iata_code) || connectedAirportIds.has(d.ident)) return '#ffff00'; // Có đường bay: Vàng rực
        return 'rgba(40, 45, 60, 0.3)'; // Điểm không liên quan: Làm tối mờ
      })
      .pointResolution(6)
      
      // ĐƯỜNG BAY: THANH MẢNH 1PX, ĐỨNG YÊN HOÀN TOÀN
      .arcColor(() => ['rgba(255, 0, 127, 0.8)', 'rgba(0, 243, 255, 0.8)'])
      .arcAltitude(0.18)
      .arcStroke(0.15) // Rất mỏng (~1px)
      .arcDashLength(1) // Đường liền đứng yên
      .arcDashGap(0)
      .arcDashAnimateTime(0) // Không chuyển động giật giật
      .onPointClick(point => {
        if (point) handleAirportSelect(point);
      });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.1;
    world.controls().enableDamping = true;

    // 2. TẢI TOÀN BỘ FILE DATA
    Promise.all([
      fetchCSV('countries.csv'),
      fetchCSV('airports.csv'),
      fetchCSV('runways.csv'),
      fetchRoutes('routes.dat')
    ]).then(([countries, airports, runways, routes]) => {
      countries.forEach(c => countriesMap.set(c.code, c.name));

      airportsList = airports.filter(d => 
        d.latitude_deg && d.longitude_deg &&
        (d.type === 'large_airport' || d.type === 'medium_airport')
      );
      
      airportsList.forEach(a => {
        if (a.ident) airportsMap.set(a.ident, a);
        if (a.iata_code) airportsMap.set(a.iata_code, a);
      });

      runwaysList = runways;
      routesList = routes;

      world.pointsData(airportsList);
    });

    function fetchCSV(filename) {
      return new Promise(resolve => {
        Papa.parse(filename, {
          download: true, header: true, dynamicTyping: true,
          complete: res => resolve(res.data)
        });
      });
    }

    function fetchRoutes(filename) {
      return new Promise(resolve => {
        Papa.parse(filename, {
          download: true, header: false, dynamicTyping: true,
          complete: res => {
            const clean = res.data.map(r => ({ src: r[2], dst: r[4] })).filter(r => r.src && r.dst);
            resolve(clean);
          }
        });
      });
    }

    // 3. XỬ LÝ CHỌN SÂN BAY & VẼ ĐƯỜNG BAY
    function handleAirportSelect(point) {
      selectedAirportId = point.ident;
      connectedAirportIds.clear();

      const matchedRoutes = [];
      const codeIATA = point.iata_code;
      const codeICAO = point.ident;

      routesList.forEach(r => {
        if (r.src === codeIATA || r.src === codeICAO) {
          const target = airportsMap.get(r.dst);
          if (target) {
            connectedAirportIds.add(r.dst);
            matchedRoutes.push({
              startLat: point.latitude_deg, startLng: point.longitude_deg,
              endLat: target.latitude_deg, endLng: target.longitude_deg
            });
          }
        } else if (r.dst === codeIATA || r.dst === codeICAO) {
          const origin = airportsMap.get(r.src);
          if (origin) {
            connectedAirportIds.add(r.src);
            matchedRoutes.push({
              startLat: origin.latitude_deg, startLng: origin.longitude_deg,
              endLat: point.latitude_deg, endLng: point.longitude_deg
            });
          }
        }
      });

      world.arcsData(matchedRoutes);
      world.pointsData([...airportsList]);

      openPanel(point, matchedRoutes.length);
    }

    // 4. MỞ PANEL THÔNG TIN
    function openPanel(point, routeCount) {
      world.controls().autoRotate = false;
      world.pointOfView({ lat: point.latitude_deg, lng: point.longitude_deg, altitude: 1.2 }, 800);

      document.body.classList.add('panel-open');

      const fullCountryName = countriesMap.get(point.iso_country) || point.iso_country || 'N/A';

      document.getElementById('airport-name').innerText = `> ${point.name || 'UNKNOWN'}`;
      document.getElementById('airport-code').innerText = `${point.ident || '---'} / ${point.iata_code || '---'}`;
      document.getElementById('airport-elev').innerText = point.elevation_ft || 'N/A';
      document.getElementById('airport-country').innerText = fullCountryName;
      document.getElementById('airport-municipality').innerText = point.municipality || 'N/A';
      
      const routeText = routeCount > 0 
        ? `${routeCount} Direct Routes Found` 
        : `0 Routes (Private / Military / Non-Commercial)`;
      document.getElementById('airport-routes').innerText = routeText;

      setTimeout(() => {
        world.width(window.innerWidth / 2);
        renderRunwayBlueprint(point.ident);
      }, 450); // Đảm bảo div đã có kích thước thực tế
    }

    function closePanel() {
      document.body.classList.remove('panel-open');
      world.controls().autoRotate = true;
      selectedAirportId = null;
      connectedAirportIds.clear();
      
      world.arcsData([]);
      world.pointsData([...airportsList]);

      setTimeout(() => {
        world.width(window.innerWidth);
      }, 100);
      
      if (blueprintRenderer) {
        document.getElementById('blueprint-view').innerHTML = '';
        cancelAnimationFrame(reqAnim);
      }
    }

    window.addEventListener('resize', () => {
      world.width(document.body.classList.contains('panel-open') ? window.innerWidth / 2 : window.innerWidth);
      world.height(window.innerHeight);
    });

    // 5. RENDER BLUEPRINT 3D THỰC TẾ (HIỂN THỊ RÕ RÀNG)
    let blueprintScene, blueprintCamera, blueprintRenderer, reqAnim;

    function renderRunwayBlueprint(airportIdent) {
      const container = document.getElementById('blueprint-view');
      container.innerHTML = '';
      cancelAnimationFrame(reqAnim);

      const w = container.clientWidth || 400;
      const h = container.clientHeight || 320;

      blueprintScene = new THREE.Scene();
      blueprintCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
      blueprintCamera.position.set(0, 65, 65);
      blueprintCamera.lookAt(0, 0, 0);

      blueprintRenderer = new THREE.WebGLRenderer({ antialias: true });
      blueprintRenderer.setClearColor(0x020b06, 1);
      blueprintRenderer.setSize(w, h);
      container.appendChild(blueprintRenderer.domElement);

      // Thêm lưới tọa độ Blueprint
      const gridHelper = new THREE.GridHelper(100, 20, 0x00ff66, 0x003311);
      blueprintScene.add(gridHelper);

      // Nhóm đối tượng xoay 360 độ
      const blueprintGroup = new THREE.Group();

      // Lấy dữ liệu đường băng từ runways.csv
      const rws = runwaysList.filter(r => r.airport_ident === airportIdent);

      const runwayMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true });
      const towerMat = new THREE.MeshBasicMaterial({ color: 0xff007f, wireframe: true });

      if (rws.length > 0) {
        rws.forEach(r => {
          const length = Math.max((r.length_ft || 6000) / 120, 20);
          const width = Math.max((r.width_ft || 150) / 25, 3);
          const heading = (r.heading_degT || 0) * (Math.PI / 180);

          const rGeo = new THREE.BoxGeometry(width, 0.5, length);
          const rMesh = new THREE.Mesh(rGeo, runwayMat);
          rMesh.rotation.y = -heading; // Đúng góc la bàn thực tế
          blueprintGroup.add(rMesh);
        });
      } else {
        // Dự phòng nếu không có thông số runway
        const defaultGeo = new THREE.BoxGeometry(4, 0.5, 50);
        blueprintGroup.add(new THREE.Mesh(defaultGeo, runwayMat));
      }

      // Tháp không lưu ATC Tower
      const towerGeo = new THREE.CylinderGeometry(2, 3.5, 16, 8);
      const towerMesh = new THREE.Mesh(towerGeo, towerMat);
      towerMesh.position.set(16, 8, 0);
      blueprintGroup.add(towerMesh);

      blueprintScene.add(blueprintGroup);

      function animate() {
        reqAnim = requestAnimationFrame(animate);
        blueprintGroup.rotation.y += 0.006; // Tự động xoay 360 độ
        blueprintRenderer.render(blueprintScene, blueprintCamera);
      }
      animate();
    }
  </script>
</body>
</html>
