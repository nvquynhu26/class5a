<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROVEXIS - Orbital Terminal Blueprints</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ea;
      --neon-green: #00ff66;
      --bg-dark: #0a0a0f;
      --hud-bg: rgba(10, 10, 15, 0.9);
      --hud-border: 1px solid var(--neon-cyan);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
      overflow: hidden;
    }

    #header {
      position: absolute; top: 20px; left: 30px; z-index: 10;
      pointer-events: none;
    }
    #header h1 {
      margin: 0; font-size: 2.2rem; letter-spacing: 4px;
      text-shadow: 0 0 10px var(--neon-cyan);
    }
    #header p {
      margin: 5px 0 0 0; font-size: 0.85rem; color: #888;
      letter-spacing: 2px;
    }

    #layout-container {
      display: flex; width: 100%; height: 100%;
    }
    #globe-container {
      width: 100%; height: 100%;
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    #side-panel {
      width: 0%; height: 100%;
      background: var(--hud-bg);
      border-left: var(--hud-border);
      box-shadow: -5px 0 20px rgba(0, 243, 255, 0.2);
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex; flex-direction: column;
      overflow: hidden; z-index: 5;
    }
    .panel-content {
      padding: 30px; width: 100vw; max-width: 50vw; opacity: 0;
      transition: opacity 0.4s;
    }

    body.panel-open #globe-container { width: 50%; }
    body.panel-open #side-panel { width: 50%; }
    body.panel-open .panel-content { opacity: 1; transition-delay: 0.3s; }

    /* Tooltip Cyberpunk */
    .aero-tooltip {
      background: rgba(10, 10, 15, 0.95);
      border: 1px solid var(--neon-cyan);
      padding: 10px 14px;
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
      pointer-events: none;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #fff;
    }

    #blueprint-view {
      width: 100%; height: 350px;
      border: 1px dashed var(--neon-green);
      margin-top: 20px; position: relative;
      background: rgba(0, 255, 102, 0.02);
    }
    .hud-title {
      font-size: 1.4rem; border-bottom: 1px solid var(--neon-cyan);
      padding-bottom: 8px; margin-bottom: 16px;
    }
    .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: transparent; color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta);
      padding: 6px 14px; cursor: pointer; font-family: inherit;
    }
    .close-btn:hover { background: var(--neon-magenta); color: #fff; }
  </style>
</head>
<body>

  <div id="header">
    <h1>AEROVEXIS</h1>
    <p>Global Aeronautical Intelligence & Orbital Terminal Blueprints</p>
  </div>

  <div id="layout-container">
    <div id="globe-container"></div>
    
    <div id="side-panel">
      <div class="panel-content">
        <button class="close-btn" onclick="closePanel()">[ ESC / CLOSE ]</button>
        <div class="hud-title" id="airport-name">SYSTEM READY...</div>
        <p><strong>CODE:</strong> <span id="airport-code">---</span></p>
        <p><strong>ELEVATION:</strong> <span id="airport-elev">---</span> ft</p>
        <p><strong>COUNTRY/REGION:</strong> <span id="airport-region">---</span></p>
        <p><strong>MUNICIPALITY:</strong> <span id="airport-municipality">---</span></p>
        
        <div id="blueprint-view"></div>
      </div>
    </div>
  </div>

  <script>
    const globeContainer = document.getElementById('globe-container');
    
    // Khởi tạo Globe với cấu hình tối giản, mượt mà nhất
    const world = Globe()(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .backgroundColor('#0a0a0f')
      .showAtmosphere(true)
      .atmosphereColor('#00f3ff')
      .atmosphereAltitude(0.12)
      
      // CẤU HÌNH ĐIỂM HOÀN TOÀN PHẲNG (KHÔNG CÓ CHIỀU CAO HÌNH TRỤ)
      .pointLat('latitude_deg')
      .pointLng('longitude_deg')
      .pointAltitude(0.001) // Cực sát mặt cầu, chấm hoàn toàn phẳng
      .pointRadius('size')
      .pointColor(d => d.type === 'large_airport' ? '#00f3ff' : '#00aa77')
      .pointResolution(6)   // Đa giác cực thấp -> GPU xử lý siêu nhẹ
      
      // SỰ KIỆN HOVER: Đã loại bỏ logic phức tạp, hover nhận ngay
      .onPointHover(point => {
        if (point) {
          globeContainer.style.cursor = 'pointer';
          world.tooltipContent(() => `
            <div class="aero-tooltip">
              <strong style="color:var(--neon-green)">${point.name}</strong><br>
              <span style="color:#aaa">CODE:</span> ${point.iata_code || point.ident} | <span style="color:#aaa">TYPE:</span> ${point.type}<br>
              <span style="color:#aaa">LOCATION:</span> ${point.municipality || 'N/A'}, ${point.iso_country}
            </div>
          `);
        } else {
          globeContainer.style.cursor = 'default';
        }
      })
      .onPointClick(point => {
        if (point) openPanel(point);
      });

    // Quay cực chậm và chống rung giật
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.15;
    world.controls().enableDamping = true;
    world.controls().dampingFactor = 0.05;

    // TẢI FILE CSV - LỌC TRIỆT ĐỂ ĐỂ KHÔNG BỊ TRÀN RAM
    Papa.parse('airports.csv', {
      download: true,
      header: true,
      dynamicTyping: true,
      complete: function(results) {
        // Chỉ giữ lại large và medium (LOẠI BỎ TOÀN BỘ small_airport, heliport, closed...)
        const cleanAirports = results.data.filter(d => 
          d.latitude_deg && d.longitude_deg &&
          (d.type === 'large_airport' || d.type === 'medium_airport')
        ).map(d => ({
          ...d,
          // Sân bay lớn chấm to rõ, sân bay vừa chấm nhỏ tinh tế
          size: d.type === 'large_airport' ? 0.35 : 0.15
        }));

        console.log(`Loaded ${cleanAirports.length} commercial airports. System optimized.`);
        world.pointsData(cleanAirports);
      }
    });

    // XỬ LÝ MỞ PANEL CHI TIẾT
    function openPanel(point) {
      world.controls().autoRotate = false;
      world.pointOfView({ lat: point.latitude_deg, lng: point.longitude_deg, altitude: 1.2 }, 800);

      document.body.classList.add('panel-open');
      
      setTimeout(() => {
        world.width(window.innerWidth / 2);
      }, 50);

      document.getElementById('airport-name').innerText = `> ${point.name || 'UNKNOWN'}`;
      document.getElementById('airport-code').innerText = `${point.ident || '---'} / ${point.iata_code || '---'}`;
      document.getElementById('airport-elev').innerText = point.elevation_ft || 'N/A';
      document.getElementById('airport-region').innerText = `${point.iso_country} / ${point.iso_region || 'N/A'}`;
      document.getElementById('airport-municipality').innerText = point.municipality || 'N/A';

      initBlueprint();
    }

    function closePanel() {
      document.body.classList.remove('panel-open');
      world.controls().autoRotate = true;
      setTimeout(() => {
        world.width(window.innerWidth);
      }, 50);
      
      if(blueprintRenderer) {
        document.getElementById('blueprint-view').innerHTML = '';
        cancelAnimationFrame(reqAnim);
      }
    }

    window.addEventListener('resize', () => {
      world.width(document.body.classList.contains('panel-open') ? window.innerWidth / 2 : window.innerWidth);
      world.height(window.innerHeight);
    });

    // MÔ PHỎNG BLUEPRINT 3D
    let blueprintScene, blueprintCamera, blueprintRenderer, reqAnim;

    function initBlueprint() {
      const container = document.getElementById('blueprint-view');
      container.innerHTML = ''; 
      cancelAnimationFrame(reqAnim);

      blueprintScene = new THREE.Scene();
      const w = container.clientWidth;
      const h = container.clientHeight;
      blueprintCamera = new THREE.PerspectiveCamera(45, w/h, 0.1, 1000);
      blueprintCamera.position.set(0, 45, 45);
      blueprintCamera.lookAt(0, 0, 0);

      blueprintRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      blueprintRenderer.setSize(w, h);
      container.appendChild(blueprintRenderer.domElement);

      const gridHelper = new THREE.GridHelper(80, 40, 0x00ff66, 0x003311);
      blueprintScene.add(gridHelper);

      // Mô phỏng đường băng phẳng dạng lưới Wireframe
      const runwayGeo = new THREE.BoxGeometry(8, 0.2, 45); 
      const runwayMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true });
      const runwayMesh = new THREE.Mesh(runwayGeo, runwayMat);
      
      const terminalGeo = new THREE.BoxGeometry(14, 4, 10);
      const terminalMat = new THREE.MeshBasicMaterial({ color: 0xff00ea, wireframe: true });
      const terminalMesh = new THREE.Mesh(terminalGeo, terminalMat);
      terminalMesh.position.set(14, 2, 0);
      
      const group = new THREE.Group();
      group.add(runwayMesh);
      group.add(terminalMesh);
      blueprintScene.add(group);

      function animate() {
        reqAnim = requestAnimationFrame(animate);
        group.rotation.y += 0.005; 
        blueprintRenderer.render(blueprintScene, blueprintCamera);
      }
      animate();
    }
  </script>
</body>
</html>
