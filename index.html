<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROVEXIS - Orbital Terminal Blueprints</title>
  
  <!-- Phông chữ Sci-fi -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- Các thư viện cần thiết -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    /* CSS BIẾN MÀU THEME CYBERPUNK */
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ea;
      --neon-green: #00ff66;
      --bg-dark: #050508;
      --hud-bg: rgba(5, 5, 8, 0.9);
      --hud-border: 1px solid rgba(0, 243, 255, 0.4);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
      overflow: hidden; /* Chống cuộn trang */
    }

    /* TRẠNG THÁI LOADING */
    #loader {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 1.5rem; text-shadow: 0 0 10px var(--neon-cyan);
      z-index: 100; pointer-events: none;
    }

    /* HEADER HUD (GÓC TRÁI TRÊN) */
    #header {
      position: absolute; top: 20px; left: 30px; z-index: 10;
      pointer-events: none; /* Xuyên thao tác chuột xuống quả cầu */
    }
    #header h1 {
      margin: 0; font-size: 2.2rem; letter-spacing: 4px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
    }
    #header p {
      margin: 5px 0 0 0; font-size: 0.85rem; color: #888;
      text-transform: uppercase; letter-spacing: 2px;
    }

    /* CONTAINER QUẢ CẦU - TỐI ƯU HIỆU NĂNG BẰNG TRANSFORM */
    #globe-wrapper {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 1;
    }

    /* BẢNG THÔNG TIN BÊN PHẢI (PANEL) */
    #side-panel {
      position: absolute;
      top: 0; right: 0;
      width: 50vw; height: 100vh;
      background: var(--hud-bg);
      border-left: var(--hud-border);
      box-shadow: -10px 0 30px rgba(0, 243, 255, 0.1);
      /* Đẩy panel ẩn sang bên phải màn hình */
      transform: translateX(100%);
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 5;
      display: flex; flex-direction: column;
      box-sizing: border-box; padding: 40px;
    }

    /* HIỆU ỨNG KHI MỞ PANEL (CLASS PANEL-OPEN) */
    body.panel-open #globe-wrapper {
      /* Dịch quả cầu sang trái 25% màn hình (Tâm quả cầu nằm giữa nửa trái) */
      transform: translateX(-25vw); 
    }
    body.panel-open #side-panel {
      /* Kéo panel vào trong màn hình */
      transform: translateX(0);
    }

    /* UI BÊN TRONG PANEL */
    .hud-title {
      font-size: 1.8rem; border-bottom: 1px solid var(--neon-cyan);
      padding-bottom: 10px; margin-bottom: 20px; color: #fff;
      text-shadow: 0 0 8px var(--neon-cyan);
    }
    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;
    }
    .info-item span:first-child { color: #666; font-size: 0.8rem; display: block; }
    .info-item span:last-child { font-size: 1.2rem; }

    /* NÚT ĐÓNG PANEL */
    .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: transparent; color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta);
      padding: 8px 15px; cursor: pointer; font-family: inherit;
      transition: all 0.3s;
    }
    .close-btn:hover {
      background: var(--neon-magenta); color: #fff; box-shadow: 0 0 15px var(--neon-magenta);
    }

    /* BLUEPRINT 3D CANVAS */
    #blueprint-view {
      flex-grow: 1; border: 1px dashed rgba(0, 255, 102, 0.5);
      position: relative; background: rgba(0, 255, 102, 0.05);
    }

    /* TOOLTIP HIỂN THỊ KHI HOVER */
    .aero-tooltip {
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid var(--neon-cyan);
      padding: 12px; border-radius: 4px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      backdrop-filter: blur(4px); pointer-events: none;
      font-family: 'Share Tech Mono', monospace; font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- LOADING INDICATOR -->
  <div id="loader">INITIALIZING AEROVEXIS...</div>

  <!-- THÔNG TIN HEADER -->
  <div id="header">
    <h1>AEROVEXIS</h1>
    <p>Orbital Terminal Blueprints & Data</p>
  </div>

  <!-- CONTAINER ĐỊA CẦU -->
  <div id="globe-wrapper">
    <div id="globe-container"></div>
  </div>
  
  <!-- PANEL BÊN PHẢI -->
  <div id="side-panel">
    <button class="close-btn" onclick="closePanel()">[ X ABORT ]</button>
    <div class="hud-title" id="airport-name">SYSTEM READY...</div>
    
    <div class="info-grid">
      <div class="info-item"><span>IATA / ICAO</span><span id="airport-code">---</span></div>
      <div class="info-item"><span>COUNTRY CODE</span><span id="airport-country">---</span></div>
      <div class="info-item"><span>ELEVATION (FT)</span><span id="airport-elev">---</span></div>
      <div class="info-item"><span>CATEGORY</span><span id="airport-type">---</span></div>
    </div>
    
    <p style="color: var(--neon-green); margin-bottom: 10px;">> TERMINAL BLUEPRINT LINK ESTABLISHED:</p>
    <!-- KHUNG CHỨA MÔ PHỎNG 3D -->
    <div id="blueprint-view"></div>
  </div>

  <script>
    // ---------------------------------------------------------
    // 1. KHỞI TẠO ĐỊA CẦU VỚI CÁC THÔNG SỐ TỐI ƯU
    // ---------------------------------------------------------
    const globeContainer = document.getElementById('globe-container');
    const world = Globe()(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .backgroundColor('rgba(0,0,0,0)') // Trong suốt để ăn theo CSS body
      .pointAltitude(0.01)
      .pointResolution(12) // Giảm số mặt polygon của điểm để tránh lag
      .showAtmosphere(true)
      .atmosphereColor('#00f3ff')
      .atmosphereAltitude(0.15)
      // CẤU HÌNH HOVER (HIỆN THÔNG TIN CƠ BẢN)
      .onPointHover(point => {
        if (point) {
          globeContainer.style.cursor = 'crosshair';
          world.tooltipContent(() => `
            <div class="aero-tooltip">
              <strong style="color:var(--neon-green); font-size:1.1rem;">${point.name}</strong><br>
              <span style="color:#aaa">Code:</span> ${point.iata_code || point.ident}<br>
              <span style="color:#aaa">Type:</span> ${point.type}<br>
              <span style="color:#aaa">Country:</span> ${point.iso_country}
            </div>
          `);
        } else {
          globeContainer.style.cursor = 'default';
        }
      })
      // CẤU HÌNH CLICK (MỞ PANEL VÀ DỊCH CHUYỂN TRÁI ĐẤT)
      .onPointClick(point => openPanel(point));

    // Quay chậm rãi, mượt mà
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.15; // Giảm tốc độ quay

    // Đảm bảo canvas luôn full màn hình dù bị dịch chuyển
    window.addEventListener('resize', () => {
      world.width(window.innerWidth);
      world.height(window.innerHeight);
    });

    // ---------------------------------------------------------
    // 2. PARSE VÀ LỌC DỮ LIỆU TỐI ƯU
    // ---------------------------------------------------------
    Papa.parse('airports.csv', {
      download: true,
      header: true,
      dynamicTyping: true,
      skipEmptyLines: true,
      complete: function(results) {
        // Tắt dòng chữ loading
        document.getElementById('loader').style.display = 'none';

        // LỌC BỎ SÂN BAY ĐÃ ĐÓNG CỬA VÀ TRỰC THĂNG NHƯ YÊU CẦU
        const filteredData = [];
        
        for (let i = 0; i < results.data.length; i++) {
          const d = results.data[i];
          
          // Chỉ lấy tọa độ hợp lệ và loại bỏ heliport / closed
          if (d.latitude_deg && d.longitude_deg && d.type !== 'heliport' && d.type !== 'closed') {
            
            // Set kích thước chấm to/nhỏ dựa theo phân loại sân bay
            let pointSize = 0.03; // Mặc định chấm nhỏ
            let pointColor = '#00f3ff';
            
            if (d.type === 'large_airport') {
              pointSize = 0.15;
              pointColor = '#ff00ea'; // Sân bay lớn màu hồng
            } else if (d.type === 'medium_airport') {
              pointSize = 0.08;
              pointColor = '#00f3ff'; // Vừa màu xanh
            }

            filteredData.push({
              lat: d.latitude_deg,
              lng: d.longitude_deg,
              size: pointSize,
              color: pointColor,
              name: d.name,
              ident: d.ident,
              iata_code: d.iata_code,
              iso_country: d.iso_country,
              type: d.type,
              elevation_ft: d.elevation_ft
            });
          }
        }

        // Đổ dữ liệu vào quả cầu
        world.pointsData(filteredData)
             .pointRadius('size')
             .pointColor('color');
      },
      error: function() {
        document.getElementById('loader').innerText = "ERROR: UNABLE TO LOAD DATA (RUN ON LOCALHOST)";
      }
    });

    // ---------------------------------------------------------
    // 3. LOGIC TƯƠNG TÁC GIAO DIỆN & CAMERA
    // ---------------------------------------------------------
    function openPanel(point) {
      // Tắt tự động quay
      world.controls().autoRotate = false;
      
      // Xoay camera mượt mà chĩa thẳng vào sân bay đã click
      world.pointOfView({ lat: point.lat, lng: point.lng, altitude: 1.2 }, 1000);

      // Kích hoạt class để CSS CSS Transform đẩy Layout sang trái/phải cực mượt
      document.body.classList.add('panel-open');
      
      // Điền thông tin vào HUD bên phải
      document.getElementById('airport-name').innerText = point.name.toUpperCase();
      document.getElementById('airport-code').innerText = `${point.iata_code || 'N/A'} / ${point.ident}`;
      document.getElementById('airport-elev').innerText = point.elevation_ft || '0';
      document.getElementById('airport-country').innerText = point.iso_country;
      document.getElementById('airport-type').innerText = point.type.replace('_', ' ').toUpperCase();

      // Mở Blueprint 3D
      initBlueprint();
    }

    function closePanel() {
      // Đóng panel
      document.body.classList.remove('panel-open');
      
      // Bật lại tự động quay địa cầu
      world.controls().autoRotate = true;
      
      // Dừng render sa bàn 3D để tiết kiệm tài nguyên GPU
      if(reqAnim) cancelAnimationFrame(reqAnim);
      document.getElementById('blueprint-view').innerHTML = '';
    }

    // ---------------------------------------------------------
    // 4. MÔ PHỎNG BLUEPRINT SÂN BAY TRONG PANEL
    // ---------------------------------------------------------
    let blueprintScene, blueprintCamera, blueprintRenderer, reqAnim, blueprintGroup;

    function initBlueprint() {
      const container = document.getElementById('blueprint-view');
      container.innerHTML = ''; 
      if(reqAnim) cancelAnimationFrame(reqAnim);

      blueprintScene = new THREE.Scene();
      
      const w = container.clientWidth;
      const h = container.clientHeight;
      blueprintCamera = new THREE.PerspectiveCamera(45, w/h, 0.1, 1000);
      blueprintCamera.position.set(0, 60, 60);
      blueprintCamera.lookAt(0, 0, 0);

      blueprintRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      blueprintRenderer.setSize(w, h);
      container.appendChild(blueprintRenderer.domElement);

      blueprintGroup = new THREE.Group();
      blueprintScene.add(blueprintGroup);

      // Grid helper (lưới tọa độ không gian)
      const gridHelper = new THREE.GridHelper(100, 40, 0x00ff66, 0x003311);
      blueprintGroup.add(gridHelper);

      // Runway giả lập (Hologram style)
      const runwayGeo = new THREE.BoxGeometry(8, 0.2, 40); 
      const runwayMat = new THREE.MeshBasicMaterial({ 
        color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.7
      });
      const runwayMesh = new THREE.Mesh(runwayGeo, runwayMat);
      blueprintGroup.add(runwayMesh);

      // Terminal block giả lập
      const terminalGeo = new THREE.BoxGeometry(12, 4, 8);
      const terminalMat = new THREE.MeshBasicMaterial({ color: 0xff00ea, wireframe: true });
      const terminalMesh = new THREE.Mesh(terminalGeo, terminalMat);
      terminalMesh.position.set(12, 2, 0);
      blueprintGroup.add(terminalMesh);

      // Vòng lặp render liên tục
      function animate() {
        reqAnim = requestAnimationFrame(animate);
        blueprintGroup.rotation.y += 0.003; // Xoay khối blueprint liên tục
        blueprintRenderer.render(blueprintScene, blueprintCamera);
      }
      animate();
    }
  </script>
</body>
</html>
