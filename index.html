<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROVEXIS - Orbital Terminal Blueprints</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ea;
      --neon-green: #00ff66;
      --bg-dark: #0a0a0f;
      --hud-bg: rgba(10, 10, 15, 0.85);
      --hud-border: 1px solid var(--neon-cyan);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
      overflow: hidden;
    }

    #header {
      position: absolute; top: 20px; left: 30px; z-index: 10; pointer-events: none;
    }
    #header h1 {
      margin: 0; font-size: 2.5rem; letter-spacing: 4px;
      text-shadow: 0 0 10px var(--neon-cyan);
    }
    #header p { margin: 5px 0 0 0; font-size: 0.9rem; color: #aaa; text-transform: uppercase; }

    #layout-container { display: flex; width: 100%; height: 100%; }
    
    #globe-container {
      width: 100%; height: 100%;
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    #side-panel {
      width: 0%; height: 100%;
      background: var(--hud-bg);
      border-left: var(--hud-border);
      box-shadow: -5px 0 20px rgba(0, 243, 255, 0.1);
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex; flex-direction: column; overflow: hidden; z-index: 5;
    }
    .panel-content {
      padding: 30px; width: 100vw; max-width: 50vw; opacity: 0;
      transition: opacity 0.5s;
    }

    body.panel-open #globe-container { width: 50%; }
    body.panel-open #side-panel { width: 50%; }
    body.panel-open .panel-content { opacity: 1; transition-delay: 0.4s; }

    .aero-tooltip {
      background: rgba(10, 10, 15, 0.9);
      border: 1px solid var(--neon-cyan);
      padding: 10px; border-radius: 4px;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      font-family: 'Share Tech Mono', monospace; pointer-events: none;
    }
    .route-tooltip { border-color: var(--neon-magenta); box-shadow: 0 0 10px rgba(255, 0, 234, 0.3); }

    #blueprint-view {
      width: 100%; height: 400px;
      border: 1px dashed var(--neon-green);
      margin-top: 20px; position: relative;
    }
    .hud-title { font-size: 1.5rem; border-bottom: 1px solid var(--neon-cyan); padding-bottom: 10px; margin-bottom: 20px; }
    .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: transparent; color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta);
      padding: 5px 15px; cursor: pointer; font-family: inherit;
    }
    .close-btn:hover { background: var(--neon-magenta); color: #fff; box-shadow: 0 0 10px var(--neon-magenta); }
  </style>
</head>
<body>

  <div id="header">
    <h1>AEROVEXIS</h1>
    <p>Global Aeronautical Intelligence & Orbital Terminal Blueprints</p>
  </div>

  <div id="layout-container">
    <div id="globe-container"></div>
    <div id="side-panel">
      <div class="panel-content">
        <button class="close-btn" onclick="closePanel()">[ ESC / CLOSE ]</button>
        <div class="hud-title" id="airport-name">SYSTEM READY...</div>
        <p><strong>IATA/ICAO:</strong> <span id="airport-code">---</span></p>
        <p><strong>ELEVATION:</strong> <span id="airport-elev">---</span> ft</p>
        
        <div id="blueprint-view"></div>
        <div style="margin-top: 20px; color: var(--neon-green)">> AWAITING RADAR LOGS...</div>
      </div>
    </div>
  </div>

  <script>
    let allAirports = [];
    let airportsMap = {}; // Dùng để tra cứu nhanh tọa độ sân bay đích
    let routesData = [];

    // 1. KHỞI TẠO ĐỊA CẦU
    const globeContainer = document.getElementById('globe-container');
    const world = Globe()(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .backgroundColor('#0a0a0f')
      .showAtmosphere(true)
      .atmosphereColor('#00f3ff')
      .atmosphereAltitude(0.15)
      
      // Cấu hình Điểm sân bay
      .pointRadius('size')
      .pointColor('color')
      .pointAltitude(0.01)
      .pointResolution(32)
      .onPointHover(point => {
        if (point) {
          globeContainer.style.cursor = 'pointer';
          world.tooltipContent(() => `
            <div class="aero-tooltip">
              <strong style="color:var(--neon-green)">${point.name}</strong><br>
              Code: ${point.iata_code || point.ident}
            </div>
          `);
        } else {
          globeContainer.style.cursor = 'default';
        }
      })
      .onPointClick(point => openPanel(point))

      // Cấu hình Đường bay (Arcs)
      .arcColor(() => '#ff00ea')
      .arcDashLength(0.4)
      .arcDashGap(0.2)
      .arcDashAnimateTime(2000)
      .arcStroke(0.5)
      .onArcHover(arc => {
        if(arc) {
          world.tooltipContent(() => `
            <div class="aero-tooltip route-tooltip">
              <span style="color:var(--neon-magenta)">>> FLIGHT ROUTE DETECTED</span><br>
              <strong>Airline ID:</strong> ${arc.airline}<br>
              <strong>From:</strong> ${arc.srcName}<br>
              <strong>To:</strong> ${arc.dstName}
            </div>
          `);
        }
      });

    // Làm chậm tốc độ quay 
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.1;

    // 2. TẢI DỮ LIỆU BIÊN GIỚI QUỐC GIA (Mờ 50%, wireframe)
    fetch('custom.geo.json').then(res => res.json()).then(geoJson => {
      world.polygonsData(geoJson.features)
        .polygonAltitude(0.005)
        .polygonCapColor(() => 'rgba(0,0,0,0)') // Trong suốt phần ruột
        .polygonSideColor(() => 'rgba(0,0,0,0)')
        .polygonStrokeColor(() => 'rgba(0, 243, 255, 0.2)'); // Viền màu xanh cyan, opacity 20-50%
    }).catch(err => console.log("Không tải được custom.geo.json"));

    // 3. TẢI DỮ LIỆU SÂN BAY
    Papa.parse('airports.csv', {
      download: true, header: true, dynamicTyping: true,
      complete: function(results) {
        allAirports = results.data.filter(d => 
          d.latitude_deg && d.longitude_deg && 
          (d.type === 'large_airport' || d.type === 'medium_airport')
        ).map(d => ({
          lat: d.latitude_deg, lng: d.longitude_deg,
          size: d.type === 'large_airport' ? 0.25 : 0.08,
          color: '#00f3ff', // Màu gốc
          ...d
        }));

        // Lập index tra cứu theo IATA và ICAO để đối chiếu với routes
        allAirports.forEach(a => {
          if(a.iata_code) airportsMap[a.iata_code] = a;
          if(a.ident) airportsMap[a.ident] = a;
        });

        world.pointsData(allAirports);
      }
    });

    // 4. TẢI DỮ LIỆU ROUTES (Đường bay)
    Papa.parse('routes.dat', {
      download: true, header: false, // routes.dat thường không có dòng header
      complete: function(results) {
        routesData = results.data.map(row => ({
          airline: row[0],  // Cột 0: Tên viết tắt hãng bay
          src: row[2],      // Cột 2: Mã IATA xuất phát
          dst: row[4]       // Cột 4: Mã IATA điểm đến
        }));
      }
    });

    // 5. ĐIỀU KHIỂN GIAO DIỆN & LOGIC LỌC ĐƯỜNG BAY
    function openPanel(point) {
      world.controls().autoRotate = false;
      world.pointOfView({ lat: point.lat, lng: point.lng, altitude: 1.2 }, 1000);
      document.body.classList.add('panel-open');
      
      setTimeout(() => { world.width(window.innerWidth / 2); }, 100);

      // Cập nhật text UI
      document.getElementById('airport-name').innerText = `> ${point.name}`;
      document.getElementById('airport-code').innerText = `${point.iata_code || ''} / ${point.ident || ''}`;
      document.getElementById('airport-elev').innerText = point.elevation_ft || 'N/A';

      // --- LOGIC VẼ ĐƯỜNG BAY & MỜ SÂN BAY ---
      const arcs = [];
      const connectedCodes = new Set();
      connectedCodes.add(point.iata_code);
      connectedCodes.add(point.ident);

      routesData.forEach(route => {
        // Nếu điểm cất cánh trùng với sân bay đang click
        if (route.src === point.iata_code || route.src === point.ident) {
          const destAirport = airportsMap[route.dst];
          if (destAirport) {
            arcs.push({
              startLat: point.lat, startLng: point.lng,
              endLat: destAirport.lat, endLng: destAirport.lng,
              airline: route.airline,
              srcName: point.name, dstName: destAirport.name
            });
            connectedCodes.add(route.dst);
          }
        }
      });

      world.arcsData(arcs); // Vẽ tia bay

      // Làm mờ các sân bay không liên quan (opacity xuống khoảng 10%)
      allAirports.forEach(a => {
        const isConnected = connectedCodes.has(a.iata_code) || connectedCodes.has(a.ident);
        a.color = isConnected ? '#00f3ff' : 'rgba(0, 243, 255, 0.05)';
      });
      world.pointsData([...allAirports]); // Cập nhật lại layer điểm

      initBlueprint();
    }

    function closePanel() {
      document.body.classList.remove('panel-open');
      world.controls().autoRotate = true;
      setTimeout(() => { world.width(window.innerWidth); }, 100);
      
      // Xóa đường bay, trả lại màu gốc cho toàn bộ sân bay
      world.arcsData([]);
      allAirports.forEach(a => a.color = '#00f3ff');
      world.pointsData([...allAirports]);

      if(blueprintRenderer) { document.getElementById('blueprint-view').innerHTML = ''; }
    }

    window.addEventListener('resize', () => {
      world.width(document.body.classList.contains('panel-open') ? window.innerWidth / 2 : window.innerWidth);
      world.height(window.innerHeight);
    });

    // 6. BLUEPRINT 3D CANVAS (Mô phỏng 3D sa bàn bên phải)
    let blueprintScene, blueprintCamera, blueprintRenderer, reqAnim;
    function initBlueprint() {
      const container = document.getElementById('blueprint-view');
      container.innerHTML = ''; 
      cancelAnimationFrame(reqAnim);

      blueprintScene = new THREE.Scene();
      const w = container.clientWidth, h = container.clientHeight;
      blueprintCamera = new THREE.PerspectiveCamera(45, w/h, 0.1, 1000);
      blueprintCamera.position.set(0, 40, 40);
      blueprintCamera.lookAt(0, 0, 0);

      blueprintRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      blueprintRenderer.setSize(w, h);
      container.appendChild(blueprintRenderer.domElement);

      const gridHelper = new THREE.GridHelper(80, 40, 0x00ff66, 0x003311);
      blueprintScene.add(gridHelper);

      // Đường băng giả định (Bạn có thể parse runways.csv ghép vào sau)
      const runwayMesh = new THREE.Mesh(
        new THREE.BoxGeometry(8, 0.2, 35), 
        new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.6 })
      );
      const terminalMesh = new THREE.Mesh(
        new THREE.BoxGeometry(12, 4, 8), 
        new THREE.MeshBasicMaterial({ color: 0xff00ea, wireframe: true })
      );
      terminalMesh.position.set(12, 2, 0);
      blueprintScene.add(runwayMesh);
      blueprintScene.add(terminalMesh);

      function animate() {
        reqAnim = requestAnimationFrame(animate);
        runwayMesh.rotation.y += 0.003;
        terminalMesh.rotation.y += 0.003; 
        blueprintRenderer.render(blueprintScene, blueprintCamera);
      }
      animate();
    }
  </script>
</body>
</html>
