<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROVEXIS - Orbital Terminal Blueprints</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ea;
      --neon-green: #00ff66;
      --bg-dark: #050508;
      --hud-bg: rgba(5, 5, 8, 0.9);
      --hud-border: 1px solid var(--neon-cyan);
    }

    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan); overflow: hidden;
    }

    /* Màn hình loading chờ xử lý dữ liệu */
    #loader {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem; color: var(--neon-green);
      text-shadow: 0 0 10px var(--neon-green);
      z-index: 100; pointer-events: none;
      transition: opacity 0.5s;
    }

    #header {
      position: absolute; top: 20px; left: 30px; z-index: 10;
      pointer-events: none;
    }
    #header h1 {
      margin: 0; font-size: 2.5rem; letter-spacing: 4px;
      text-shadow: 0 0 10px var(--neon-cyan);
    }
    #header p { margin: 5px 0 0 0; font-size: 0.9rem; color: #888; }

    /* Tối ưu hiệu năng: Dùng transform thay vì thay đổi width */
    #globe-wrapper {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #side-panel {
      position: absolute; top: 0; right: 0;
      width: 45vw; height: 100vh;
      background: var(--hud-bg);
      border-left: var(--hud-border);
      box-shadow: -10px 0 30px rgba(0, 243, 255, 0.1);
      transform: translateX(100%);
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 20; display: flex; flex-direction: column;
    }

    /* Trạng thái mở Panel */
    body.panel-open #globe-wrapper { transform: translateX(-22.5vw); }
    body.panel-open #side-panel { transform: translateX(0); }

    .panel-content { padding: 40px; height: 100%; box-sizing: border-box; overflow-y: auto; }

    /* Tooltip tối ưu CSS */
    .aero-tooltip {
      background: rgba(0,0,0,0.8);
      border: 1px solid var(--neon-cyan);
      padding: 12px; border-radius: 2px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      backdrop-filter: blur(5px);
      pointer-events: none; will-change: transform;
    }

    #blueprint-view {
      width: 100%; height: 350px;
      border: 1px dashed rgba(0, 255, 102, 0.5);
      margin-top: 30px; position: relative;
    }

    .hud-title {
      font-size: 1.8rem; border-bottom: 1px solid var(--neon-cyan);
      padding-bottom: 15px; margin-bottom: 25px; text-transform: uppercase;
    }

    .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: transparent; color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta);
      padding: 8px 20px; cursor: pointer; font-family: inherit; font-size: 1rem;
      transition: all 0.2s;
    }
    .close-btn:hover { background: var(--neon-magenta); color: #000; box-shadow: 0 0 15px var(--neon-magenta); }
    
    .data-row { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 8px 0; }
    .data-label { color: #888; }
  </style>
</head>
<body>

  <div id="loader">INITIALIZING ORBITAL SENSORS...</div>

  <div id="header">
    <h1>AEROVEXIS</h1>
    <p>Global Aeronautical Intelligence & Orbital Terminal Blueprints</p>
  </div>

  <div id="globe-wrapper">
    <div id="globe-container"></div>
  </div>
  
  <div id="side-panel">
    <div class="panel-content">
      <button class="close-btn" onclick="closePanel()">[ ESC / CLOSE ]</button>
      <div class="hud-title" id="airport-name">SYSTEM READY</div>
      
      <div class="data-row"><span class="data-label">IDENTIFIER (IATA/ICAO):</span> <strong id="airport-code">---</strong></div>
      <div class="data-row"><span class="data-label">COUNTRY CODE:</span> <strong id="airport-country">---</strong></div>
      <div class="data-row"><span class="data-label">ELEVATION (MSL):</span> <strong id="airport-elev">--- ft</strong></div>
      
      <div id="blueprint-view"></div>
      
      <div style="margin-top: 25px; color: var(--neon-green); font-size: 0.9rem;">
        > AWAITING RUNWAY & TELEMETRY DATA LINK...<br>
        > AUDIO FEED: STANDBY
      </div>
    </div>
  </div>

  <script>
    // 1. KHỞI TẠO QUẢ ĐỊA CẦU NGAY LẬP TỨC THAY VÌ CHỜ DỮ LIỆU
    const globeContainer = document.getElementById('globe-container');
    const world = Globe()(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .backgroundColor('rgba(0,0,0,0)')
      .pointAltitude(0.01)
      .pointResolution(16) // Giảm resolution để tăng FPS
      .showAtmosphere(true)
      .atmosphereColor('#00f3ff')
      .atmosphereAltitude(0.15)
      .onPointHover(point => {
        globeContainer.style.cursor = point ? 'pointer' : 'default';
        if (point) {
          world.tooltipContent(() => `
            <div class="aero-tooltip">
              <strong style="color:var(--neon-green); font-size:1.1rem;">${point.name}</strong><br><br>
              Country: <span style="color:#fff">${point.iso_country}</span><br>
              Type: <span style="color:#fff">${point.type.replace('_', ' ').toUpperCase()}</span>
            </div>
          `);
        }
      })
      .onPointClick(point => openPanel(point));

    // Quay cực chậm và mượt
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.15;
    world.controls().enableDamping = true; 
    world.controls().dampingFactor = 0.05;

    // 2. PARSE CSV TRÊN LUỒNG WORKER (TRÁNH LAG TRÌNH DUYỆT)
    Papa.parse('airports.csv', {
      download: true,
      header: true,
      dynamicTyping: true,
      worker: true, // Kích hoạt Web Worker xử lý ngầm
      skipEmptyLines: true,
      complete: function(results) {
        document.getElementById('loader').style.opacity = 0; // Ẩn loader
        
        // Tối ưu: Lọc bỏ sân bay rác, chỉ giữ điểm có tọa độ và thuộc loại lớn/vừa
        const filteredData = results.data.filter(d => 
          d.latitude_deg && d.longitude_deg && 
          (d.type === 'large_airport' || d.type === 'medium_airport')
        );

        const mappedData = filteredData.map(d => ({
          lat: d.latitude_deg,
          lng: d.longitude_deg,
          size: d.type === 'large_airport' ? 0.35 : 0.15, 
          color: d.type === 'large_airport' ? '#00f3ff' : '#0066ff',
          ...d
        }));

        world.pointsData(mappedData)
             .pointRadius('size')
             .pointColor('color');
      }
    });

    // 3. LOGIC XỬ LÝ GIAO DIỆN HIỆU NĂNG CAO
    function openPanel(point) {
      world.controls().autoRotate = false;
      // Bay tới điểm click (1 giây)
      world.pointOfView({ lat: point.lat, lng: point.lng, altitude: 0.6 }, 1000);

      // Kích hoạt animation trượt Layout
      document.body.classList.add('panel-open');

      document.getElementById('airport-name').innerText = point.name || 'UNKNOWN';
      document.getElementById('airport-code').innerText = `${point.iata_code || '---'} / ${point.ident || '---'}`;
      document.getElementById('airport-elev').innerText = `${point.elevation_ft || 0} ft`;
      document.getElementById('airport-country').innerText = point.iso_country || '---';

      initBlueprint();
    }

    function closePanel() {
      document.body.classList.remove('panel-open');
      world.controls().autoRotate = true;
      clearBlueprint(); // Giải phóng RAM ngay khi đóng
    }

    // Lắng nghe phím ESC để đóng
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePanel();
    });

    window.addEventListener('resize', () => {
      world.width(window.innerWidth).height(window.innerHeight);
    });

    // 4. MÔ PHỎNG BLUEPRINT 3D VÀ QUẢN LÝ BỘ NHỚ
    let bpScene, bpCamera, bpRenderer, reqAnim;
    let bpGeometry, bpMaterial, bpMesh; 

    function initBlueprint() {
      clearBlueprint(); // Dọn dẹp trước khi render mới

      const container = document.getElementById('blueprint-view');
      bpScene = new THREE.Scene();
      
      bpCamera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      bpCamera.position.set(0, 40, 40);
      bpCamera.lookAt(0, 0, 0);

      bpRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      bpRenderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(bpRenderer.domElement);

      const grid = new THREE.GridHelper(80, 40, 0x00ff66, 0x003311);
      bpScene.add(grid);

      bpGeometry = new THREE.BoxGeometry(10, 0.5, 40); 
      bpMaterial = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.7 });
      bpMesh = new THREE.Mesh(bpGeometry, bpMaterial);
      bpScene.add(bpMesh);

      function animate() {
        reqAnim = requestAnimationFrame(animate);
        bpMesh.rotation.y += 0.005; // Xoay vòng tròn 360 độ
        bpRenderer.render(bpScene, bpCamera);
      }
      animate();
    }

    function clearBlueprint() {
      if(reqAnim) cancelAnimationFrame(reqAnim);
      if(bpRenderer) {
        document.getElementById('blueprint-view').innerHTML = '';
        bpRenderer.dispose();
      }
      if(bpGeometry) bpGeometry.dispose();
      if(bpMaterial) bpMaterial.dispose();
      bpScene = null;
    }
  </script>
</body>
</html>
