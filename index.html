<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROVEXIS - Orbital Terminal Blueprints</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ea;
      --neon-green: #00ff66;
      --neon-blue: #0088ff;
      --bg-dark: #050508;
      --hud-bg: rgba(5, 5, 8, 0.9);
      --hud-border: 1px solid rgba(0, 243, 255, 0.4);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
      overflow: hidden;
    }

    #header {
      position: absolute; top: 20px; left: 30px; z-index: 10;
      pointer-events: none; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }
    #header h1 { margin: 0; font-size: 2rem; letter-spacing: 3px; }
    #header p { margin: 5px 0 0 0; font-size: 0.85rem; color: #888; }

    #layout-container { display: flex; width: 100vw; height: 100vh; }
    
    #globe-container {
      width: 100vw; height: 100vh;
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    #side-panel {
      width: 0vw; height: 100vh;
      background: var(--hud-bg);
      border-left: var(--hud-border);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8);
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex; flex-direction: column;
      overflow-y: auto; z-index: 5;
    }
    
    .panel-content {
      padding: 30px; width: 40vw; /* Fixed width to prevent reflow */
      opacity: 0; transition: opacity 0.3s ease-in-out;
    }

    body.panel-open #globe-container { width: 60vw; }
    body.panel-open #side-panel { width: 40vw; }
    body.panel-open .panel-content { opacity: 1; transition-delay: 0.4s; }

    .aero-tooltip {
      background: rgba(10, 10, 15, 0.95);
      border: 1px solid var(--neon-cyan);
      padding: 12px; border-radius: 2px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      pointer-events: none; font-size: 0.9rem;
      text-transform: uppercase;
    }
    .aero-tooltip .highlight { color: var(--neon-green); font-size: 1.1rem; }

    #blueprint-view {
      width: 100%; height: 350px;
      border: 1px solid rgba(0, 255, 102, 0.3);
      background: rgba(0, 255, 102, 0.05);
      margin: 20px 0; position: relative;
    }

    .hud-title {
      font-size: 1.4rem; border-bottom: 1px dashed var(--neon-cyan);
      padding-bottom: 10px; margin-bottom: 20px; color: #fff;
    }

    .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: transparent; color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta);
      padding: 8px 16px; cursor: pointer; font-family: inherit;
      transition: all 0.2s;
    }
    .close-btn:hover { background: rgba(255, 0, 234, 0.2); box-shadow: 0 0 10px var(--neon-magenta); }
    
    .data-row { margin: 8px 0; font-size: 0.95rem; }
    .data-label { color: #888; display: inline-block; width: 100px; }
  </style>
</head>
<body>

  <div id="header">
    <h1>AEROVEXIS</h1>
    <p>Global Aeronautical Intelligence & Orbital Terminal Blueprints</p>
  </div>

  <div id="layout-container">
    <div id="globe-container"></div>
    
    <div id="side-panel">
      <div class="panel-content">
        <button class="close-btn" onclick="closePanel()">[ X ] ABORT</button>
        <div class="hud-title" id="ap-name">AWAITING TARGET...</div>
        
        <div class="data-row"><span class="data-label">IDENT:</span> <span id="ap-ident" style="color: var(--neon-green)">---</span></div>
        <div class="data-row"><span class="data-label">TYPE:</span> <span id="ap-type">---</span></div>
        <div class="data-row"><span class="data-label">ELEV:</span> <span id="ap-elev">---</span> FT</div>
        <div class="data-row"><span class="data-label">COORDS:</span> <span id="ap-coords">---</span></div>
        
        <div id="blueprint-view"></div>
        
        <div style="color: #666; font-size: 0.85rem;">
          > SCANNING RUNWAYS... <br>
          > INTERCEPTING ATC FREQUENCIES...
        </div>
      </div>
    </div>
  </div>

  <script>
    // Khởi tạo Globe
    const globeContainer = document.getElementById('globe-container');
    const world = Globe({ animateIn: false })(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .backgroundColor('#050508')
      .pointAltitude(0.01)
      .pointResolution(12) // Giảm lưới geometry của điểm để tăng FPS
      .showAtmosphere(true)
      .atmosphereColor('#00f3ff')
      .atmosphereAltitude(0.15)
      .onPointHover(point => {
        globeContainer.style.cursor = point ? 'crosshair' : 'default';
        if (point) {
          world.tooltipContent(() => `
            <div class="aero-tooltip">
              <div class="highlight">${point.name}</div>
              ID: ${point.ident || point.iata_code || 'N/A'}<br>
              TYPE: ${point.type}<br>
              ELEV: ${point.elevation_ft || 0} FT
            </div>
          `);
        }
      })
      .onPointClick(point => openPanel(point));

    // Cấu hình xoay chậm
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.15;
    world.controls().enableDamping = true; // Chuyển động mượt khi user kéo thả

    // Tải và lọc dữ liệu bằng Web Worker (Chống đơ UI)
    Papa.parse('airports.csv', {
      download: true,
      header: true,
      dynamicTyping: true,
      worker: true, // Kích hoạt chạy nền
      complete: function(results) {
        // Lọc bỏ heliport, closed... chỉ lấy sân bay hợp lệ
        const validTypes = ['large_airport', 'medium_airport', 'small_airport'];
        
        const filtered = results.data.filter(d => 
          d.latitude_deg != null && d.longitude_deg != null && 
          validTypes.includes(d.type)
        );

        // Phân cấp màu sắc & kích thước
        const mappedData = filtered.map(d => {
          let size = 0.02, color = '#006699'; // Mặc định cho small_airport
          if (d.type === 'large_airport') { size = 0.15; color = '#00f3ff'; }
          else if (d.type === 'medium_airport') { size = 0.06; color = '#00ff66'; }

          return { lat: d.latitude_deg, lng: d.longitude_deg, size, color, ...d };
        });

        world.pointsData(mappedData)
             .pointRadius('size')
             .pointColor('color');
      }
    });

    // Xử lý Layout & Camera khi Click
    let resizeTimeout;
    function openPanel(point) {
      document.body.classList.add('panel-open');
      
      // Khóa auto rotate và focus camera vào điểm mục tiêu
      world.controls().autoRotate = false;
      
      // Tính toán góc lệch để khi mở panel, điểm click vẫn nằm chính giữa phần bản đồ còn lại
      world.pointOfView({ lat: point.lat, lng: point.lng, altitude: 0.7 }, 800);

      // Cập nhật DOM
      document.getElementById('ap-name').innerText = `> ${point.name}`;
      document.getElementById('ap-ident').innerText = `${point.iata_code || ''} / ${point.ident}`;
      document.getElementById('ap-type').innerText = (point.type).replace('_', ' ').toUpperCase();
      document.getElementById('ap-elev').innerText = point.elevation_ft || '0';
      document.getElementById('ap-coords').innerText = `${point.lat.toFixed(4)}, ${point.lng.toFixed(4)}`;

      // Cập nhật lại width của Three.js canvas mượt mà
      cancelAnimationFrame(resizeTimeout);
      let start = performance.now();
      function syncResize(now) {
        let progress = (now - start) / 600;
        if(progress < 1) {
          world.width(globeContainer.clientWidth);
          resizeTimeout = requestAnimationFrame(syncResize);
        } else {
          world.width(globeContainer.clientWidth);
        }
      }
      requestAnimationFrame(syncResize);

      initBlueprint();
    }

    function closePanel() {
      document.body.classList.remove('panel-open');
      world.controls().autoRotate = true;
      
      cancelAnimationFrame(resizeTimeout);
      let start = performance.now();
      function syncResize(now) {
        let progress = (now - start) / 600;
        if(progress < 1) {
          world.width(globeContainer.clientWidth);
          resizeTimeout = requestAnimationFrame(syncResize);
        } else {
          world.width(window.innerWidth);
        }
      }
      requestAnimationFrame(syncResize);
      
      if(reqAnim) cancelAnimationFrame(reqAnim);
    }

    window.addEventListener('resize', () => {
      world.width(globeContainer.clientWidth);
      world.height(window.innerHeight);
    });

    // Mô phỏng Blueprint 3D
    let blueprintScene, blueprintCamera, blueprintRenderer, reqAnim;

    function initBlueprint() {
      const container = document.getElementById('blueprint-view');
      container.innerHTML = ''; 
      if(reqAnim) cancelAnimationFrame(reqAnim);

      blueprintScene = new THREE.Scene();
      
      const w = container.clientWidth;
      const h = container.clientHeight || 350;
      blueprintCamera = new THREE.PerspectiveCamera(45, w/h, 0.1, 1000);
      blueprintCamera.position.set(0, 60, 60);
      blueprintCamera.lookAt(0, 0, 0);

      blueprintRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      blueprintRenderer.setSize(w, h);
      container.appendChild(blueprintRenderer.domElement);

      const gridHelper = new THREE.GridHelper(100, 40, 0x00ff66, 0x002211);
      blueprintScene.add(gridHelper);

      // Nhóm đối tượng để xoay đồng bộ
      const modelGroup = new THREE.Group();

      // Dải đường băng
      const rwGeo = new THREE.BoxGeometry(8, 0.2, 45); 
      const rwMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true });
      const runway = new THREE.Mesh(rwGeo, rwMat);
      modelGroup.add(runway);

      // Terminal
      const termGeo = new THREE.BoxGeometry(12, 4, 8);
      const termMat = new THREE.MeshBasicMaterial({ color: 0xff00ea, wireframe: true });
      const terminal = new THREE.Mesh(termGeo, termMat);
      terminal.position.set(12, 2, 0);
      modelGroup.add(terminal);

      blueprintScene.add(modelGroup);

      function animate() {
        reqAnim = requestAnimationFrame(animate);
        modelGroup.rotation.y += 0.003; // Xoay chậm mô hình
        blueprintRenderer.render(blueprintScene, blueprintCamera);
      }
      animate();
    }
  </script>
</body>
</html>
