<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROVEXIS - Orbital Terminal Blueprints</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- Thư viện cần thiết -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    /* CYBERPUNK THEME VARIABLES */
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ea;
      --neon-green: #00ff66;
      --bg-dark: #0a0a0f;
      --hud-bg: rgba(10, 10, 15, 0.85);
      --hud-border: 1px solid var(--neon-cyan);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
      overflow: hidden;
    }

    /* HEADER HUD */
    #header {
      position: absolute; top: 20px; left: 30px; z-index: 10;
      pointer-events: none;
    }
    #header h1 {
      margin: 0; font-size: 2.5rem; letter-spacing: 4px;
      text-shadow: 0 0 10px var(--neon-cyan);
    }
    #header p {
      margin: 5px 0 0 0; font-size: 0.9rem; color: #aaa;
      text-transform: uppercase; letter-spacing: 2px;
    }

    /* BỐ CỤC CHIA ĐÔI */
    #layout-container {
      display: flex; width: 100%; height: 100%;
    }
    #globe-container {
      width: 100%; height: 100%;
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    /* PANEL BÊN PHẢI (BLUEPRINT) */
    #side-panel {
      width: 0%; height: 100%;
      background: var(--hud-bg);
      border-left: var(--hud-border);
      box-shadow: -5px 0 20px rgba(0, 243, 255, 0.2);
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex; flex-direction: column;
      overflow: hidden; z-index: 5;
    }
    .panel-content {
      padding: 30px; width: 100vw; max-width: 50vw; opacity: 0;
      transition: opacity 0.5s;
    }

    /* Trạng thái khi mở Panel */
    body.panel-open #globe-container { width: 50%; }
    body.panel-open #side-panel { width: 50%; }
    body.panel-open .panel-content { opacity: 1; transition-delay: 0.4s; }

    /* TOOLTIP HIỂN THỊ THÔNG TIN KHI HOVER */
    .aero-tooltip {
      background: var(--hud-bg);
      border: 1px solid var(--neon-cyan);
      padding: 10px; border-radius: 4px;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      backdrop-filter: blur(4px); pointer-events: none;
    }

    /* BLUEPRINT 3D CANVAS CONTAINER */
    #blueprint-view {
      width: 100%; height: 400px;
      border: 1px dashed var(--neon-green);
      margin-top: 20px; position: relative;
    }
    .hud-title {
      font-size: 1.5rem; border-bottom: 1px solid var(--neon-cyan);
      padding-bottom: 10px; margin-bottom: 20px;
    }
    .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: transparent; color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta);
      padding: 5px 15px; cursor: pointer; font-family: inherit;
    }
    .close-btn:hover { background: var(--neon-magenta); color: #fff; box-shadow: 0 0 10px var(--neon-magenta); }
  </style>
</head>
<body>

  <div id="header">
    <h1>AEROVEXIS</h1>
    <p>Global Aeronautical Intelligence & Orbital Terminal Blueprints</p>
  </div>

  <div id="layout-container">
    <div id="globe-container"></div>
    
    <div id="side-panel">
      <div class="panel-content">
        <button class="close-btn" onclick="closePanel()">[ ESC / CLOSE ]</button>
        <div class="hud-title" id="airport-name">SYSTEM READY...</div>
        <p><strong>IATA/ICAO:</strong> <span id="airport-code">---</span></p>
        <p><strong>ELEVATION:</strong> <span id="airport-elev">---</span> ft</p>
        <p><strong>COUNTRY:</strong> <span id="airport-country">---</span></p>
        
        <!-- Khung chứa Blueprint 3D -->
        <div id="blueprint-view"></div>
        
        <div style="margin-top: 20px;">
          <p style="color: var(--neon-green)">> LOGS // FREQUENCIES // COMMENTS WILL STREAM HERE...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ----------------------------------------------------------------
    // 1. KHỞI TẠO QUẢ ĐỊA CẦU (GLOBE.GL)
    // ----------------------------------------------------------------
    const globeContainer = document.getElementById('globe-container');
    const world = Globe()(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg') // Dark style
      .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundColor('#0a0a0f') // Khớp với bg dark
      .pointAltitude(0.01)
      .pointColor(() => '#00f3ff')
      .pointResolution(32)
      .showAtmosphere(true)
      .atmosphereColor('#00f3ff')
      .atmosphereAltitude(0.15)
      .onPointHover(point => {
        // Hover Sân bay -> Hiện tooltip
        if (point) {
          globeContainer.style.cursor = 'pointer';
          world.tooltipContent(() => `
            <div class="aero-tooltip">
              <strong style="color:#00ff66">${point.name} (${point.iata_code || point.ident})</strong><br>
              Country: ${point.iso_country}<br>
              Type: ${point.type}
            </div>
          `);
        } else {
          globeContainer.style.cursor = 'default';
        }
      })
      .onPointClick(point => {
        openPanel(point);
      });

    // Tự động xoay địa cầu
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    // ----------------------------------------------------------------
    // 2. TẢI VÀ XỬ LÝ DỮ LIỆU CSV BẰNG PAPAPARSE
    // ----------------------------------------------------------------
    // Gọi file airports.csv từ local folder
    Papa.parse('airports.csv', {
      download: true,
      header: true,
      dynamicTyping: true,
      complete: function(results) {
        console.log("Airports loaded:", results.data.length);
        
        // Lọc bớt dữ liệu để trình duyệt không quá tải (ví dụ: chỉ lấy sân bay lớn/vừa)
        const filteredAirports = results.data.filter(d => 
          d.latitude_deg && d.longitude_deg && 
          (d.type === 'large_airport' || d.type === 'medium_airport')
        );

        // Map dữ liệu vào Globe
        const mappedData = filteredAirports.map(d => ({
          lat: d.latitude_deg,
          lng: d.longitude_deg,
          size: d.type === 'large_airport' ? 0.3 : 0.1, // Chấm to/nhỏ theo size
          ...d
        }));

        world.pointsData(mappedData)
             .pointRadius('size');
      },
      error: function() {
        console.warn("⚠️ Không tìm thấy file airports.csv. Vui lòng chạy trên localhost.");
        // Dữ liệu giả định để test UI nếu không load được CSV
        world.pointsData([
          { lat: 21.0285, lng: 105.8542, name: 'Noi Bai Intl', size: 0.3, iso_country: 'VN' },
          { lat: 10.7626, lng: 106.6601, name: 'Tan Son Nhat Intl', size: 0.3, iso_country: 'VN' }
        ]).pointRadius('size');
      }
    });

    /* Gợi ý: Bạn có thể viết thêm Papa.parse('custom.geo.json') ở đây để gán world.polygonsData() hiển thị biên giới quốc gia */

    // ----------------------------------------------------------------
    // 3. LOGIC UI (CHUYỂN MÀN HÌNH / MỞ PANEL)
    // ----------------------------------------------------------------
    function openPanel(point) {
      // Dừng auto rotate và xoay camera tới điểm vừa click
      world.controls().autoRotate = false;
      world.pointOfView({ lat: point.lat, lng: point.lng, altitude: 0.8 }, 1000);

      // Thêm class để CSS kích hoạt Layout (50/50)
      document.body.classList.add('panel-open');
      
      // Resize lại canvas quả cầu cho vừa 50% màn hình
      setTimeout(() => {
        world.width(window.innerWidth / 2);
      }, 100); // Đợi CSS transition một chút

      // Cập nhật thông tin text
      document.getElementById('airport-name').innerText = `> ${point.name || 'UNKNOWN TERMINAL'}`;
      document.getElementById('airport-code').innerText = `${point.iata_code || ''} / ${point.ident || ''}`;
      document.getElementById('airport-elev').innerText = point.elevation_ft || 'N/A';
      document.getElementById('airport-country').innerText = point.iso_country || 'N/A';

      // Khởi tạo sa bàn 3D (Blueprint)
      initBlueprint(point);
    }

    function closePanel() {
      document.body.classList.remove('panel-open');
      world.controls().autoRotate = true;
      setTimeout(() => {
        world.width(window.innerWidth);
      }, 100);
      
      // Hủy cảnh 3D hiện tại để tiết kiệm bộ nhớ
      if(blueprintRenderer) {
        document.getElementById('blueprint-view').innerHTML = '';
      }
    }

    // Lắng nghe sự kiện resize trình duyệt
    window.addEventListener('resize', () => {
      if(document.body.classList.contains('panel-open')) {
        world.width(window.innerWidth / 2);
      } else {
        world.width(window.innerWidth);
      }
      world.height(window.innerHeight);
    });

    // ----------------------------------------------------------------
    // 4. MÔ PHỎNG BLUEPRINT 3D TRONG HUD (CYBERPUNK STYLE)
    // ----------------------------------------------------------------
    let blueprintScene, blueprintCamera, blueprintRenderer, reqAnim;

    function initBlueprint(pointData) {
      const container = document.getElementById('blueprint-view');
      container.innerHTML = ''; // Clear canvas cũ
      cancelAnimationFrame(reqAnim);

      blueprintScene = new THREE.Scene();
      
      // Kích thước chuẩn bằng div container
      const w = container.clientWidth;
      const h = container.clientHeight;
      blueprintCamera = new THREE.PerspectiveCamera(45, w/h, 0.1, 1000);
      blueprintCamera.position.set(0, 50, 50);
      blueprintCamera.lookAt(0, 0, 0);

      blueprintRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      blueprintRenderer.setSize(w, h);
      container.appendChild(blueprintRenderer.domElement);

      // Grid helper phát sáng (Mặt đất)
      const gridHelper = new THREE.GridHelper(100, 50, 0x00ff66, 0x003311);
      blueprintScene.add(gridHelper);

      // Mô phỏng đường băng (Box geometry dạng wireframe/hologram)
      // *Thực tế: Ở đây bạn parse file runways.csv để lấy length_ft và width_ft đắp vào geometry
      const geometry = new THREE.BoxGeometry(10, 0.5, 40); 
      const material = new THREE.MeshBasicMaterial({ 
        color: 0x00f3ff, 
        wireframe: true,
        transparent: true,
        opacity: 0.8
      });
      const runwayMesh = new THREE.Mesh(geometry, material);
      blueprintScene.add(runwayMesh);

      // Mô phỏng khối nhà ga
      const terminalGeo = new THREE.BoxGeometry(15, 5, 10);
      const terminalMat = new THREE.MeshBasicMaterial({ color: 0xff00ea, wireframe: true });
      const terminalMesh = new THREE.Mesh(terminalGeo, terminalMat);
      terminalMesh.position.set(15, 2.5, 0);
      blueprintScene.add(terminalMesh);

      // Hiệu ứng xoay model 360 độ
      function animate() {
        reqAnim = requestAnimationFrame(animate);
        runwayMesh.rotation.y += 0.005;
        terminalMesh.rotation.y += 0.005; // Group 2 khối này lại sẽ quay đồng trục mượt hơn
        blueprintRenderer.render(blueprintScene, blueprintCamera);
      }
      animate();
    }
  </script>
</body>
</html>
